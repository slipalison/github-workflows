name: Preparar o runner
description: >-
  Trava a saida de rede, faz o checkout sem deixar credencial no disco e instala
  a linguagem com cache. Sao os quatro passos que abrem todo job de CI.

# POR QUE EXISTE
# --------------
# No TranslateReader estes mesmos passos aparecem, identicos, em doze arquivos.
# Nao e so feio: o `harden-runner` esta fixado por SHA em doze lugares, entao
# atualizar a versao e editar doze arquivos e torcer para nao esquecer um. Um
# esquecido nao da erro — so deixa de ter a protecao, calado.
#
# No simulator-ccb o mesmo preambulo aparece em quatorze jobs, sem harden-runner
# e sem `persist-credentials: false`.
#
# Aqui e um arquivo.

inputs:
  linguagem:
    description: "dotnet | python | node | go | nenhuma"
    required: false
    default: "nenhuma"
  versao:
    description: "Versao da linguagem; vazio = o padrao desta action"
    required: false
    default: ""
  historico-completo:
    description: >-
      fetch-depth: 0. Necessario para o Sonar (blame por linha para 'New Code')
      e para varredura de segredo no historico. Custa tempo em repositorio
      grande, entao nao e o padrao.
    required: false
    default: "false"
  egresso:
    description: >-
      Politica de saida do harden-runner: audit (registra) ou block (bloqueia o
      que nao estiver em allowed-endpoints). 'audit' e o padrao porque 'block'
      sem a lista pronta quebra o job em vez de proteger — a lista sai do
      relatorio de um run em 'audit'.
    required: false
    default: "audit"
  destinos-liberados:
    description: "Lista para egresso=block, um `host:porta` por linha"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Precisa vir ANTES do checkout: o que ele monitora e a rede do job inteiro,
    # e o checkout ja e trafego de saida.
    #
    # Dentro de uma composite action o runner avisa `pre execution is not
    # supported for local action`. O aviso e verdadeiro e o efeito e pequeno: o
    # harden-runner perde o gancho `pre`, que rodaria antes de tudo, e passa a
    # instalar o monitor quando este passo roda. Como `preparar` e o PRIMEIRO
    # passo de todo job, o que fica de fora e so a preparacao do proprio runner.
    # A alternativa — repetir o harden-runner solto em cada job, como faz o
    # TranslateReader — devolveria o gancho e traria de volta a duplicacao em
    # doze arquivos que esta action existe para eliminar.
    - name: Endurecer o runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: ${{ inputs.egresso }}
        allowed-endpoints: ${{ inputs.destinos-liberados }}

    # persist-credentials: false. Por padrao o checkout DEIXA o token do run
    # gravado em .git/config, e dali qualquer passo seguinte — inclusive um
    # script de dependencia de terceiro — consegue le-lo e empurrar commit.
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: ${{ inputs.historico-completo == 'true' && 0 || 1 }}

    # O `cache:` do setup-python e do setup-node FALHA — nao avisa, falha — quando
    # nao encontra arquivo de dependencia:
    #   "No file in ... matched to [**/requirements.txt or **/pyproject.toml]"
    # Um repositorio de scripts soltos, ou um modulo Go puro, nao tem nenhum. E
    # o cache e otimizacao: nao pode derrubar o job de quem nao precisa dele.
    - name: Ha o que cachear?
      id: cache
      shell: bash
      run: |
        set -euo pipefail
        python=""
        node=""
        if ls requirements*.txt pyproject.toml setup.py 2>/dev/null | head -1 | grep -q .; then
          python="pip"
        fi
        if ls package-lock.json npm-shrinkwrap.json yarn.lock 2>/dev/null | head -1 | grep -q .; then
          node="npm"
        fi
        echo "python=$python" >> "$GITHUB_OUTPUT"
        echo "node=$node" >> "$GITHUB_OUTPUT"

    - name: .NET
      if: inputs.linguagem == 'dotnet'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ inputs.versao || '9.0.x' }}

    - name: Python
      if: inputs.linguagem == 'python'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.versao || '3.13' }}
        cache: ${{ steps.cache.outputs.python }}

    - name: Node
      if: inputs.linguagem == 'node'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.versao || '22' }}
        cache: ${{ steps.cache.outputs.node }}

    - name: Go
      if: inputs.linguagem == 'go'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ inputs.versao || '1.24' }}

    # O `cache: true` do setup-dotnet exige packages.lock.json, que nem todo
    # projeto tem — e sem o arquivo ele falha do mesmo jeito que o do Python.
    # Este cache nao depende de lockfile: a chave sai do conteudo dos csproj.
    - name: Cache do NuGet
      if: inputs.linguagem == 'dotnet'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: nuget-${{ runner.os }}-
