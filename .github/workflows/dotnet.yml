name: .NET — build e testes

on:
  workflow_call:
    inputs:
      dotnet_version:
        required: false
        type: string
        default: "9.0.x"
      solution:
        description: "Arquivo .sln ou .csproj; vazio = descobre sozinho"
        required: false
        type: string
        default: ""
      run_tests:
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Cache do NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ inputs.solution }}

      - name: Build
        # --no-restore garante que o passo anterior valeu de alguma coisa.
        run: dotnet build ${{ inputs.solution }} --configuration Release --no-restore

      - name: Testes com cobertura
        if: inputs.run_tests
        run: |
          dotnet test ${{ inputs.solution }} \
            --configuration Release --no-build \
            --logger "trx;LogFileName=testes.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./resultados

      - name: Publicar resultados
        if: always() && inputs.run_tests
        uses: actions/upload-artifact@v4
        with:
          name: resultados-de-teste
          path: ./resultados
          retention-days: 7
