name: Seguranca

# Seis varreduras num job so, e o CodeQL a parte:
#
#   SBOM                    lista do que entrou no build
#   SCA                     dependencia vulneravel
#   IaC                     Dockerfile, manifesto e chart — so com caminho_iac
#   Semgrep                 SAST rapido, por padrao (`p/default` do registro)
#   Gitleaks e TruffleHog   segredo, no historico inteiro
#   CodeQL                  SAST profundo — DESLIGADO por padrao (ver o input),
#                           job proprio, porque leva minutos e tem matriz
#
# POR QUE UM JOB, E NAO SETE
# --------------------------
# Ate 2026-09-23 eram sete jobs em paralelo, mais um de contexto. Nenhum dependia
# do outro, e o paralelismo nao comprava relogio nenhum: o Sonar, ao lado, leva
# ~4,6 min, e as varreduras SOMADAS levam ~2,5. O que ele comprava era conta. O
# GitHub cobra cada job arredondado para cima ao minuto, e estes rodavam em 4 a
# 31 segundos. Medido no basalto em setembro: 66 execucoes da esteira, sete
# minutos cobrados por ~150 s de trabalho em cada uma — ~460 min no mes, um
# quarto de toda a cota do repositorio, e dois tercos disso eram arredondamento.
#
# UM JOB MUDA TRES COISAS, e cada uma tem resposta aqui:
#
#   1. Uma varredura reprovada nao pode esconder as outras. Todo passo depois
#      do `Preparar` roda com `!cancelled()`: o job continua ate o fim, cada
#      portao escreve o seu painel, e o job sai vermelho se QUALQUER passo
#      falhou.
#
#   2. As varreduras dividem o disco. Separadas, cada uma via o checkout limpo.
#      Juntas, o Trivy leria o relatorio do Gitleaks — que traz o segredo que
#      achou, e o Trivy o acusaria de novo — e o SBOM catalogaria o binario do
#      Gitleaks como se fosse do projeto. Toda saida vai para `$RUNNER_TEMP`,
#      nada fica no workspace, e a ordem e: o que olha a arvore primeiro (SBOM,
#      SCA, IaC), o que olha o historico depois.
#
#   3. Uma permissao para todos. O job pede `security-events: write` para o
#      upload de SARIF, e o Gitleaks e o TruffleHog, que antes rodavam so com
#      leitura, passam a dividir o job com ela. O TruffleHog e de terceiro, mas
#      fixado por SHA como tudo aqui, e nenhum passo recebe o token por `with:`.
#
# PORTAO QUE NAO MORDE
# --------------------
# O portao do Gitleaks (`bloquear: error`) nunca reprovou nada, desde que a
# esteira existe: o Gitleaks 8.30.1 grava os achados SEM `level`, sem
# `defaultConfiguration` e sem `security-severity`, e o `resumo_sarif.py` le
# achado sem nivel como `warning`. Todo segredo virava "aviso" no painel. O
# passo do Gitleaks agora marca cada achado como `error`: segredo no historico
# e sempre acionavel (rotacionar), e o que for dado de teste vai para o
# `.gitleaks.toml` do repositorio, por valor, com a justificativa.
#
# VARREDURA QUE NAO RODA TEM DE FALHAR
# ------------------------------------
# De 2026-09-13 a 2026-09-23 o Semgrep NAO varreu nada, em nenhum repositorio
# da esteira, e o job ficou verde o tempo todo. `--config auto` exige metricas
# ligadas, e o passo rodava com `--metrics=off`: o Semgrep saia com erro ("Cannot
# create auto config when metrics are off"), o `|| true` engolia, nenhum SARIF
# era escrito, e o `resumo_sarif.py` le arquivo ausente como "nada achado" — de
# proposito, porque ha scanner que nao escreve arquivo quando nao acha nada.
#
# Por isso cada varredura que escreve SARIF confere o proprio resultado: saida
# diferente de zero, SARIF ausente ou SARIF sem regra e FALHA do passo, com a
# mensagem do que houve. "Nao rodou" nao pode passar por "nada achado".
#
# O QUE ESTE ARQUIVO CORRIGE
# --------------------------
# O `simulator-ccb` acerta em rodar as varreduras e erra no resto: cada job
# termina com ~60 linhas de `echo` montando a mesma tabela a mao, e antes disso
# quatro `python3 -c` de uma linha contando achados no mesmo JSON. Dez jobs, dez
# copias. Todas aquelas ferramentas falam SARIF — entao ler, contar e desenhar a
# tabela e UM problema. Aqui e `relatar-sarif`.
#
# REPOSITORIO PRIVADO
# -------------------
# Enviar SARIF para a aba Security exige GitHub Advanced Security, que num
# repositorio privado e pago. Sem GHAS o `upload-sarif` FALHA. A saida obvia —
# `continue-on-error: true` — devolve o pior dos mundos: sem aba, sem resumo, e
# o job verde. Aqui o upload e condicional e o RESULTADO nao depende dele: o
# `relatar-sarif` escreve o painel e aplica o portao de qualquer jeito. Num
# repositorio privado perde-se a aba Security, nao o controle.

on:
  workflow_call:
    inputs:
      linguagens_codeql:
        description: >-
          JSON array para a matriz do CodeQL, ex.: '["csharp","javascript"]'.
          Vazio desliga o CodeQL — que e o certo para repositorio sem codigo
          compilavel que ele entenda, e melhor que um job que sempre falha.
        required: false
        type: string
        default: '[]'
      publicar_sarif:
        description: "auto (publico sim, privado nao) | sempre | nunca"
        required: false
        type: string
        default: "auto"
      bloquear_sca:
        description: "Nivel do portao de dependencia vulneravel"
        required: false
        type: string
        default: "error"
      bloquear_sast:
        description: "Nivel do portao do Semgrep"
        required: false
        type: string
        default: "error"
      caminho_iac:
        description: "Diretorio de IaC a varrer; vazio desliga a varredura"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Resolvido UMA vez, aqui, e lido pelos dois jobs. Era o job `Contexto` — cinco
# segundos cobrados como um minuto em toda execucao. Uma copia da expressao em
# cada job desatualizaria em silencio; uma variavel do workflow nao.
#
# `toJSON(...) == 'false'`, e nao `== false`: `github.event.repository.private`
# vem vazio em alguns gatilhos, e na comparacao frouxa das expressoes do Actions
# `null == false` e VERDADEIRO — vazio viraria "publico", e o upload quebraria
# com 403. Vazio tem de valer como PRIVADO: errar para o lado de nao publicar so
# perde a aba.
env:
  PUBLICA_SARIF: ${{ inputs.publicar_sarif == 'sempre' || (inputs.publicar_sarif == 'auto' && toJSON(github.event.repository.private) == 'false') }}

jobs:
  varreduras:
    name: Varreduras
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Conferir as entradas
        env:
          MODO: ${{ inputs.publicar_sarif }}
        run: |
          set -euo pipefail
          case "$MODO" in
            sempre|nunca|auto) ;;
            *) echo "::error::publicar_sarif invalido: $MODO"; exit 1 ;;
          esac
          if [ "$PUBLICA_SARIF" != "true" ]; then
            echo "::notice::SARIF nao sera enviado a aba Security (repositorio privado sem GHAS, ou desligado). O resultado aparece no painel deste job e os portoes continuam valendo."
          fi

      - name: Preparar
        id: preparar
        uses: slipalison/github-workflows/.github/actions/preparar@main
        with:
          # Segredo vazado continua no historico depois de removido do HEAD. Uma
          # varredura so do ultimo commit acha o que acabou de entrar e perde o
          # que ja esta la — que e justamente o que importa rotacionar.
          historico-completo: "true"
          # Para o Semgrep, que se instala pelo pip.
          linguagem: python

      - name: Onde as saidas ficam
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seguranca"
          echo "SAIDA=$RUNNER_TEMP/seguranca" >> "$GITHUB_ENV"

      # ------------------------------------------------------------- SBOM --
      # Primeiro, com o workspace ainda so com o checkout.
      - name: Gerar SBOM (SPDX)
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.SAIDA }}/sbom.spdx.json
          upload-artifact: false

      - name: Guardar o SBOM
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx
          path: ${{ env.SAIDA }}/sbom.spdx.json
          retention-days: 90

      - name: Resumo do SBOM
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        run: |
          set -euo pipefail
          total=$(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1])).get('packages',[])))" "$SAIDA/sbom.spdx.json")
          {
            echo "## SBOM"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Pacotes catalogados | ${total} |"
            echo "| Formato | SPDX 2.3 (JSON) |"
            echo "| Artefato | \`sbom-spdx\`, 90 dias |"
            echo ""
            echo "A lista de tudo que entrou no build. Serve para responder"
            echo "\"estamos expostos?\" no dia em que sair um CVE novo — sem SBOM"
            echo "essa pergunta vira arqueologia em cada repositorio."
          } >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------------- SCA --
      - name: SCA - Trivy no sistema de arquivos
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: ${{ env.SAIDA }}/trivy-fs.sarif
          # O banco do Trivy fora do workspace, pelo mesmo motivo das saidas.
          cache-dir: ${{ runner.temp }}/trivy-cache
          # ignore-unfixed: um CVE sem correcao disponivel nao e acionavel —
          # bloquear por ele so ensina a usar `--skip`. Volta a aparecer no dia
          # em que houver patch.
          ignore-unfixed: true
          # vuln,secret e SO. `misconfig` estava aqui e foi tirado: esta varredura
          # bloqueia em `error`, e a de IaC logo abaixo varre a MESMA
          # configuracao de proposito SEM bloquear (o Kyverno e o Pod Security
          # `restricted` ja sao donos daquelas regras dentro do cluster). Com as
          # duas ligadas, a mesma regra tinha dois donos com veredito oposto — e
          # quem ganhava era o que bloqueava. Foi medido: o DS-0002 do Dockerfile
          # do demo-python reprovou aqui e passou no IaC, no mesmo run.
          scanners: vuln,secret
          exit-code: "0"

      # -------------------------------------------------------------- IaC --
      - name: IaC - Trivy em configuracao
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' && inputs.caminho_iac != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.caminho_iac }}
          format: sarif
          output: ${{ env.SAIDA }}/trivy-iac.sarif
          cache-dir: ${{ runner.temp }}/trivy-cache
          exit-code: "0"

      # ---------------------------------------------------------- Semgrep --
      - name: Instalar Semgrep
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        # Versao fixa: `pip install semgrep` traz motor novo sem commit, e um
        # motor novo reprova um pull request que nao mudou nada.
        run: pip install --only-binary ':all:' semgrep==1.177.0

      - name: SAST - Semgrep
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        # Uma unica passada, SARIF. O simulator-ccb roda o semgrep DUAS vezes
        # (uma para JSON, outra para SARIF) para poder contar os achados — e a
        # contagem sai do proprio SARIF.
        #
        # `p/default`, e nao `auto`: `auto` exige metricas ligadas, e com
        # `--metrics=off` o Semgrep nem comeca (ver "VARREDURA QUE NAO RODA" no
        # cabecalho). `p/default` e o conjunto padrao do registro, independe de
        # metrica, e aplica as regras das linguagens que acha no repositorio.
        # Medido em 2026-09-23 com o 1.177.0: 1.074 regras no conjunto; 274
        # aplicadas no basalto, 263 no coluna, 344 no demo-python.
        #
        # O que se aceita: as regras vem do registro (semgrep.dev) e mudam sem
        # commit aqui, entao uma regra nova em `error` pode reprovar um PR que
        # nao mudou nada. So `error` bloqueia (`bloquear_sast`), e copiar as
        # regras para dentro deste repositorio, que e publico, esbarra na
        # licenca delas (Semgrep Rules License), que restringe redistribuicao.
        # Se o registro estiver fora do ar, o passo FALHA — que e o certo.
        run: |
          set -euo pipefail
          configs=(--config p/default)
          if [ -d .semgrep ]; then configs+=(--config .semgrep/); fi
          # Achado NAO muda a saida (sem `--error`): quem decide e o portao do
          # relatar-sarif. Saida diferente de zero e o Semgrep que nao rodou.
          rc=0
          semgrep scan "${configs[@]}" --sarif --output "$SAIDA/semgrep.sarif" --metrics=off || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::O Semgrep saiu com codigo $rc e NAO varreu (ver o log acima). Varredura que nao roda nao passa como 'nada achado'."
            exit 1
          fi
          if [ ! -s "$SAIDA/semgrep.sarif" ]; then
            echo "::error::O Semgrep saiu com 0 e nao escreveu o SARIF."
            exit 1
          fi
          regras="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["runs"][0]["tool"]["driver"].get("rules", [])))' "$SAIDA/semgrep.sarif")"
          if [ "$regras" -eq 0 ]; then
            echo "::error::O SARIF do Semgrep veio sem nenhuma regra: a varredura nao testou nada."
            exit 1
          fi
          echo "Semgrep: $regras regras no conjunto."

      # ---------------------------------------------------------- Segredos --
      # Por ultimo: olham o HISTORICO, e nao a arvore.
      - name: Segredo - Gitleaks
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        # `detect` em vez da action oficial: a action exige GITHUB_TOKEN com
        # escrita para comentar no PR, e este job roda sem ela. O binario faz a
        # mesma varredura e devolve SARIF.
        run: |
          set -euo pipefail
          versao=8.30.1
          # --proto '=https': sem isto um redirecionamento pode cair em http e
          # o binario chega por texto puro. --tlsv1.2 fecha o resto.
          # O binario vai para $RUNNER_TEMP: no workspace, o SBOM e o Trivy o
          # tomariam por codigo do projeto.
          curl -sSfL --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${versao}/gitleaks_${versao}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          # `--exit-code 0`: achar segredo nao muda a saida — quem decide se
          # isso derruba o job e o portao do relatar-sarif, num lugar so. Entao
          # saida diferente de zero e o Gitleaks que nao rodou. Ate 2026-09-23
          # havia um `|| true` aqui, que so servia para esconder isso (ver
          # "VARREDURA QUE NAO RODA" no cabecalho).
          #
          # Saida 0 com SARIF valido AINDA nao prova que ele varreu. Medido com
          # o 8.30.1 fora de um repositorio git: loga `ERR [git] fatal: not a
          # git repository`, varre 0 commits, diz "no leaks found", sai 0 e
          # escreve um SARIF com as regras e nenhum resultado. Um clone raso ou
          # um "dubious ownership" do git dariam o mesmo. A prova e a linha
          # "N commits scanned" que ele mesmo imprime, com N maior que zero.
          log="$RUNNER_TEMP/gitleaks.log"
          "$RUNNER_TEMP/gitleaks" detect --source . --report-format sarif \
            --report-path "$SAIDA/gitleaks.sarif" --exit-code 0 2>&1 | tee "$log"
          if [ ! -s "$SAIDA/gitleaks.sarif" ]; then
            echo "::error::O Gitleaks saiu com 0 e nao escreveu o SARIF."
            exit 1
          fi
          commits="$(sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -oE '[0-9]+ commits scanned' | grep -oE '^[0-9]+' | tail -1)"
          if [ "${commits:-0}" -eq 0 ]; then
            echo "::error::O Gitleaks varreu ${commits:-0} commits (ver o log acima): sem historico, a varredura de segredo nao testou nada."
            exit 1
          fi
          echo "Gitleaks: $commits commits varridos."
          # O 8.30.1 grava os achados sem nivel nenhum, e o resumo_sarif.py le
          # isso como `warning` — abaixo do `bloquear: error` deste portao, que
          # por isso nunca reprovou (ver "PORTAO QUE NAO MORDE" no cabecalho).
          # Segredo no historico e sempre `error`. Dado de teste se declara no
          # `.gitleaks.toml` do repositorio, que o Gitleaks le da raiz sozinho.
          python3 - "$SAIDA/gitleaks.sarif" <<'PY'
          import json, sys
          caminho = sys.argv[1]
          sarif = json.load(open(caminho, encoding="utf-8"))
          n = 0
          for run in sarif.get("runs", []):
              for resultado in run.get("results", []):
                  resultado["level"] = "error"
                  n += 1
          json.dump(sarif, open(caminho, "w", encoding="utf-8"))
          print(f"Gitleaks: {n} achado(s), todos como error.")
          PY

      - name: Segredo - TruffleHog
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          # base vazio varre o historico inteiro. Com base == head — o que
          # acontece num push de commit unico — o intervalo fica vazio e a action
          # falha em vez de varrer.
          base: ""
          # --only-verified: o TruffleHog CONFIRMA a credencial contra o servico
          # antes de reportar. Sem isto o ruido e tao alto que o passo vira
          # decoracao; com isto, cada achado e uma chave que funciona agora.
          extra_args: --only-verified

      # ----------------------------------------------- aba Security e paineis --
      # `hashFiles` so enxerga o workspace, e as saidas moram fora dele. Quem diz
      # o que existe e este passo.
      - name: O que cada varredura gerou
        id: gerados
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        run: |
          set -euo pipefail
          for s in semgrep trivy-fs trivy-iac; do
            if [ -s "$SAIDA/$s.sarif" ]; then echo "$s=true"; else echo "$s=false"; fi
          done >> "$GITHUB_OUTPUT"

      - name: Enviar o Semgrep para a aba Security
        if: ${{ !cancelled() && env.PUBLICA_SARIF == 'true' && steps.gerados.outputs.semgrep == 'true' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ env.SAIDA }}/semgrep.sarif
          category: semgrep

      - name: Enviar o SCA para a aba Security
        if: ${{ !cancelled() && env.PUBLICA_SARIF == 'true' && steps.gerados.outputs.trivy-fs == 'true' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ env.SAIDA }}/trivy-fs.sarif
          category: trivy-fs

      - name: Enviar o IaC para a aba Security
        if: ${{ !cancelled() && env.PUBLICA_SARIF == 'true' && steps.gerados.outputs.trivy-iac == 'true' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ env.SAIDA }}/trivy-iac.sarif
          category: trivy-iac

      - name: Relatar - Gitleaks
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        uses: slipalison/github-workflows/.github/actions/relatar-sarif@main
        with:
          sarif: ${{ env.SAIDA }}/gitleaks.sarif
          titulo: "Segredo no historico - Gitleaks"
          bloquear: error
          explicacao: >-
            Varre TODO o historico, nao so o commit atual. Um segredo removido do
            HEAD continua acessivel em qualquer clone. Achado aqui significa
            rotacionar a credencial, nao so apagar a linha.

      - name: Relatar - Semgrep
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        uses: slipalison/github-workflows/.github/actions/relatar-sarif@main
        with:
          sarif: ${{ env.SAIDA }}/semgrep.sarif
          titulo: "SAST - Semgrep"
          bloquear: ${{ inputs.bloquear_sast }}
          explicacao: >-
            Analise estatica por padrao, rapida. Complementa o CodeQL em vez de
            repeti-lo: o CodeQL segue fluxo de dados e leva minutos; o Semgrep
            casa forma e leva segundos, e aceita regra propria do projeto em
            `.semgrep/`.

      - name: Relatar - SCA
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' }}
        uses: slipalison/github-workflows/.github/actions/relatar-sarif@main
        with:
          sarif: ${{ env.SAIDA }}/trivy-fs.sarif
          titulo: "SCA - dependencia vulneravel"
          bloquear: ${{ inputs.bloquear_sca }}
          explicacao: >-
            Le os arquivos de dependencia do repositorio (requirements, csproj,
            package-lock, go.mod) e cruza com as bases publicas de CVE. Roda
            antes da imagem existir — e barato e pega o problema no lugar onde
            ele se conserta, que e o arquivo de dependencia.

      - name: Relatar - IaC
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' && inputs.caminho_iac != '' }}
        uses: slipalison/github-workflows/.github/actions/relatar-sarif@main
        with:
          sarif: ${{ env.SAIDA }}/trivy-iac.sarif
          titulo: "IaC - Dockerfile, manifesto e Helm"
          bloquear: ""
          explicacao: >-
            Le Dockerfile, manifesto de Kubernetes e chart em busca de
            configuracao insegura (container como root, capability a mais, sem
            limite de recurso). Sem portao de proposito: o cluster ja recusa o
            que importa pelo Kyverno e pelo Pod Security `restricted`, entao
            aqui isto e diagnostico, e nao um segundo dono da mesma regra.

  sast-codeql:
    name: SAST - CodeQL (${{ matrix.linguagem }})
    if: inputs.linguagens_codeql != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        linguagem: ${{ fromJSON(inputs.linguagens_codeql) }}
    steps:
      # O CodeQL publica o resultado na aba Security como parte do `analyze` —
      # nao da para separar. Sem GHAS, num repositorio privado, isso falha com
      # 403 depois de a analise inteira ter rodado: vinte minutos para descobrir
      # um problema de licenca. Este passo custa cinco segundos e diz o que
      # fazer.
      - name: Conferir que o resultado tem onde ser publicado
        if: env.PUBLICA_SARIF != 'true'
        run: |
          echo "::error::CodeQL esta ligado (linguagens_codeql), mas este run nao pode publicar SARIF — repositorio privado sem GitHub Advanced Security, ou publicar_sarif desligado."
          echo '::error::O passo analyze do CodeQL publica na aba Security e nao tem modo so-relatorio: ou se habilita o GHAS, ou se passa linguagens_codeql vazio e se usa o Semgrep, que ja roda e cujo resultado aparece no painel.'
          exit 1

      - name: Preparar
        uses: slipalison/github-workflows/.github/actions/preparar@main

      - name: Iniciar CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.linguagem }}
          # build-mode: none — nao compila. Para C# isto perde um pouco de
          # precisao e ganha o job inteiro: com build, o CodeQL precisa do SDK,
          # das dependencias privadas e do tempo de build, e passa a quebrar por
          # motivo que nao tem nada a ver com seguranca.
          build-mode: none
          queries: security-extended

      - name: Analisar
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.linguagem }}"
          # upload-database: false — a base do CodeQL de repositorio privado nao
          # deve sair daqui.
          upload-database: false
