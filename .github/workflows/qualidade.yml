name: Qualidade

# Lint, testes e cobertura — um job POR COMPONENTE, todos em paralelo.
#
# O QUE ESTE ARQUIVO CORRIGE
# --------------------------
# O `simulator-ccb` tem `backend-build` e, com `needs: backend-build`,
# `backend-tests`. O job de build nao sobe artefato nenhum — entao o de teste
# refaz `restore` e `build` do zero. O `needs` ali nao economiza trabalho: ele
# so SERIALIZA dois builds identicos. O mesmo acontece com os dois frontends.
# Sao tres pares, seis builds, tres esperas — para nada.
#
# Aqui build e teste vivem no MESMO job (o build ja e pre-requisito do teste,
# nao ha o que paralelizar entre eles) e o que corre em paralelo sao os
# COMPONENTES, que de fato nao dependem um do outro.
#
# Um componente e um objeto JSON:
#   nome         rotulo do job e do artefato
#   linguagem    dotnet | python | node | go | rust
#   versao       opcional; vazio = padrao da action `preparar`
#   caminho      diretorio de trabalho, padrao "."
#   projeto      dotnet: .sln/.slnx/.csproj | node: workspace | go: ./...
#                rust: pacote do workspace (--package); vazio = --workspace
#   cobertura    piso em %; 0 (padrao) desliga o portao daquele componente
#   scripts_de_instalacao
#                node: true deixa o `npm ci` rodar os scripts de instalacao
#                das dependencias (postinstall e afins). O padrao e
#                --ignore-scripts: um pacote comprometido executa na instalacao,
#                antes de qualquer teste. Ligue so se algum pacote nativo
#                precisar compilar — e saiba qual.
#   so           runner do componente: ubuntu-* (padrao ubuntu-latest) ou
#                windows-*, este so com `linguagem: rust`, a unica medida no
#                Windows. Fora disso, reprova no primeiro passo.
#   pacotes_sistema
#                pacotes apt, separados por espaco, instalados antes do build;
#                so em runner Linux. Ex.: as bibliotecas do webview do Tauri.
#   auditoria    rust: true roda `cargo audit` no Cargo.lock do componente, que
#                le as excecoes do `.cargo/audit.toml` DELE. So em Linux: o
#                Cargo.lock e o mesmo em qualquer SO, auditar duas vezes nao
#                prova nada novo.
#   build_release
#                rust: um pacote do workspace; o passo `Build <pacote>
#                (release)` roda `cargo build -p <pacote> --release --locked`.
#                O `cargo llvm-cov` compila instrumentado, em perfil de teste:
#                so este passo prova que o binario de PRODUCAO compila.
#   empacotar_tauri
#                rust: true empacota o app Tauri de `build_release` com o
#                `cargo tauri build`: deb, rpm e AppImage no Linux; msi e o
#                instalador NSIS no Windows. Exige `build_release` e
#                `caminho_tauri`. Os pacotes vao para o artefato
#                `pacotes-<nome>`, com o nome do produto em minusculas e `-` no
#                lugar de espaco (`ddc-control_0.1.0_amd64.deb`).
#   caminho_tauri
#                diretorio do tauri.conf.json, relativo a raiz do checkout. O
#                `caminho` do componente e o do workspace, e o app Tauri costuma
#                morar num subdiretorio dele.
#   binarios_extra
#                rust: pacotes do workspace, separados por espaco, compilados em
#                release e publicados no mesmo artefato: `<bin>-<alvo>.tar.gz`
#                no Linux e `<bin>-<alvo>.zip` no Windows, cada um com o binario
#                e o LICENSE da raiz, e nada mais. O binario tem o nome do
#                pacote.
#   carimbar_versao
#                rust: true escreve o input `versao` no Cargo.toml do `caminho`
#                antes do build de release, e confere o `--version` de cada
#                binario extra. O repositorio guarda `0.0.0`; so o pacote leva
#                a versao do produto.
#
# O INPUT `versao` E A VERSAO DO PRODUTO (1.4.0), a que o job `versao` calcula.
# O campo `versao` de um componente e outra coisa: a versao da LINGUAGEM.
#
# Sem os campos a partir de `so`, o componente roda os mesmos passos e comandos
# de antes, no ubuntu-latest. So a chave do cache do `target/` ganhou o runner.

on:
  workflow_call:
    inputs:
      componentes:
        description: "JSON array de componentes. Ver o cabecalho deste arquivo."
        required: false
        type: string
        default: '[{"nome":"app","linguagem":"python"}]'
      timeout:
        required: false
        type: number
        default: 20
      versao:
        description: >-
          Versao do PRODUTO (1.4.0), a que o job `versao` calculou. Nao e o
          `versao` de um componente, que e o da linguagem. So o componente com
          `carimbar_versao: true` a usa.
        required: false
        type: string
        default: ""
    secrets:
      GH_PACKAGES_TOKEN:
        description: >-
          Token de LEITURA do npm do GitHub (`read:packages`), para componente
          node que dependa de pacote privado do proprio dono. So o `npm ci`
          precisa dele: `build` e `test` nao falam com o registro, e o npm
          tolera a variavel ausente no `.npmrc` (medido no npm 11). Opcional.
        required: false

permissions:
  contents: read

jobs:
  qualidade:
    # `nome` no rotulo: com matriz, sem isto a tela mostra "qualidade (Object)"
    # em todos os jobs e nao da para saber qual falhou sem abrir cada um.
    name: ${{ matrix.c.nome }}
    # `so` fora de ubuntu-*/windows-* cai no ubuntu-latest, e o passo
    # `Conferir componente` reprova com o motivo. Passado direto, um rotulo que
    # nenhum runner tem deixaria o job esperando na fila, sem passo nenhum que
    # dissesse por que.
    runs-on: ${{ (startsWith(matrix.c.so, 'ubuntu-') || startsWith(matrix.c.so, 'windows-')) && matrix.c.so || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
    strategy:
      # fail-fast: false. O padrao mata os outros componentes quando um falha, e
      # aparece so o primeiro erro; com tres componentes isso vira tres rodadas
      # de CI para descobrir tres problemas que dava para ver de uma vez.
      fail-fast: false
      matrix:
        c: ${{ fromJSON(inputs.componentes) }}
    defaults:
      run:
        working-directory: ${{ matrix.c.caminho || '.' }}
        # bash tambem no Windows, onde o padrao e o pwsh e nenhum script daqui
        # roda (`set -euo pipefail`, `[ ]`, `$VAR`). No Linux o `shell: bash`
        # explicito so acrescenta o `pipefail` a quem nao o liga sozinho; todo
        # `run:` com pipe aqui ja faz `set -euo pipefail`, entao nada muda.
        shell: bash
    steps:
      - name: Conferir componente
        # Antes do checkout e sem rede: um campo errado reprova aqui, dizendo
        # qual e por que, em vez de virar passo pulado em silencio ou erro de
        # apt no meio do build. Os valores vem do JSON de quem chama e chegam
        # por `env`, nunca interpolados no script. `working-directory: .`
        # porque o `caminho` so existe depois do checkout.
        working-directory: .
        env:
          SO: ${{ matrix.c.so || '' }}
          LINGUAGEM: ${{ matrix.c.linguagem }}
          PACOTES: ${{ matrix.c.pacotes_sistema || '' }}
          # toJSON, e nao `== true`: a string "true" com aspas seria ignorada
          # calada, e o componente passaria sem auditoria achando que tem.
          AUDITORIA: ${{ toJSON(matrix.c.auditoria) }}
          RELEASE: ${{ matrix.c.build_release || '' }}
          TAURI: ${{ toJSON(matrix.c.empacotar_tauri) }}
          CAMINHO_TAURI: ${{ matrix.c.caminho_tauri || '' }}
          EXTRA: ${{ matrix.c.binarios_extra || '' }}
          CARIMBAR: ${{ toJSON(matrix.c.carimbar_versao) }}
          VERSAO_PRODUTO: ${{ inputs.versao }}
        run: |
          set -euo pipefail
          erro=0
          reprovar() { echo "::error::$1"; erro=1; }
          case "$SO" in
            "" | ubuntu-* | windows-*) ;;
            *) reprovar "so: aceito ubuntu-* ou windows-*." ;;
          esac
          # Windows so com rust: e a unica linguagem que rodou la, com o
          # `shell: bash` daqui e o `preparar` (ddc-control, 2026-09-27).
          # dotnet, python, node e go nunca passaram por isso no Windows, e o
          # `go test -race` ainda pede cgo com um gcc que o runner nao traz.
          # Liberar outra linguagem exige um run real que a prove.
          if [[ $SO == windows-* ]] && [ "$LINGUAGEM" != "rust" ]; then
            reprovar "so: windows-* so com linguagem rust, a unica medida no Windows."
          fi
          # [[ =~ ]], e nao grep: o grep casa linha a linha, e um valor com
          # quebra de linha passaria se uma das linhas fosse valida.
          re_pacotes='^[a-z0-9][a-z0-9.+-]*( [a-z0-9][a-z0-9.+-]*)*$'
          if [ -n "$PACOTES" ]; then
            [[ $PACOTES =~ $re_pacotes ]] ||
              reprovar "pacotes_sistema: nomes de pacote apt separados por um espaco ($re_pacotes)."
            [ "$RUNNER_OS" = "Linux" ] ||
              reprovar "pacotes_sistema e apt: so em runner Linux (este e $RUNNER_OS)."
          fi
          case "$AUDITORIA" in
            true)
              if [ "$LINGUAGEM" != "rust" ] || [ "$RUNNER_OS" != "Linux" ]; then
                reprovar "auditoria: so em componente rust num runner Linux."
              fi
              ;;
            false | null) ;;
            *) reprovar "auditoria: true ou false, sem aspas." ;;
          esac
          re_pacote_cargo='^[A-Za-z0-9_-]+$'
          if [ -n "$RELEASE" ]; then
            [ "$LINGUAGEM" = "rust" ] ||
              reprovar "build_release: so em componente rust."
            [[ $RELEASE =~ $re_pacote_cargo ]] ||
              reprovar "build_release: nome de pacote cargo ($re_pacote_cargo)."
          fi
          for campo in "empacotar_tauri=$TAURI" "carimbar_versao=$CARIMBAR"; do
            case "${campo#*=}" in
              true)
                [ "$LINGUAGEM" = "rust" ] || reprovar "${campo%%=*}: so em componente rust."
                ;;
              false | null) ;;
              *) reprovar "${campo%%=*}: true ou false, sem aspas." ;;
            esac
          done
          # O Tauri empacota o binario que `build_release` acabou de provar, e
          # procura o tauri.conf.json em `caminho_tauri`: sem um dos dois nao
          # ha o que empacotar.
          if [ "$TAURI" = "true" ]; then
            [ -n "$RELEASE" ] ||
              reprovar "empacotar_tauri: exige build_release, o pacote do app."
            [ -n "$CAMINHO_TAURI" ] ||
              reprovar "empacotar_tauri: exige caminho_tauri, o diretorio do tauri.conf.json."
          fi
          re_caminho='^[A-Za-z0-9_./-]+$'
          if [ -n "$CAMINHO_TAURI" ]; then
            [ "$TAURI" = "true" ] ||
              reprovar "caminho_tauri: so com empacotar_tauri: true."
            if ! [[ $CAMINHO_TAURI =~ $re_caminho ]] || [[ $CAMINHO_TAURI == *..* ]]; then
              reprovar "caminho_tauri: caminho relativo ao checkout ($re_caminho), sem '..'."
            fi
          fi
          re_binarios='^[A-Za-z0-9_-]+( [A-Za-z0-9_-]+)*$'
          if [ -n "$EXTRA" ]; then
            [ "$LINGUAGEM" = "rust" ] ||
              reprovar "binarios_extra: so em componente rust."
            [[ $EXTRA =~ $re_binarios ]] ||
              reprovar "binarios_extra: pacotes cargo separados por um espaco ($re_binarios)."
          fi
          re_versao='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$CARIMBAR" = "true" ]; then
            if [ -z "$VERSAO_PRODUTO" ]; then
              reprovar "carimbar_versao: exige o input versao, a do produto."
            elif ! [[ $VERSAO_PRODUTO =~ $re_versao ]]; then
              reprovar "versao: X.Y.Z ($re_versao)."
            elif [ "$TAURI" = "true" ]; then
              # O MSI guarda a versao em tres campos: major e minor ate 255,
              # patch ate 65535. Acima disso o WiX reprova no fim do build,
              # depois de minutos de compilacao; aqui, antes do checkout. O
              # tamanho vem antes da conta, que estouraria com vinte digitos.
              IFS=. read -r major minor patch <<< "$VERSAO_PRODUTO"
              if [ "${#major}" -gt 3 ] || [ "${#minor}" -gt 3 ] || [ "${#patch}" -gt 5 ] ||
                 (( 10#$major > 255 || 10#$minor > 255 || 10#$patch > 65535 )); then
                reprovar "versao $VERSAO_PRODUTO: o MSI aceita major e minor ate 255 e patch ate 65535."
              fi
            fi
          fi
          exit "$erro"

      - name: Preparar
        uses: slipalison/github-workflows/.github/actions/preparar@main
        with:
          linguagem: ${{ matrix.c.linguagem }}
          versao: ${{ matrix.c.versao || '' }}

      - name: Instalar pacotes do sistema
        # Depois do `preparar`: o apt e trafego de saida, e o harden-runner
        # precisa ja estar olhando. A lista passou pela regex no primeiro passo
        # e chega por `env`.
        if: runner.os == 'Linux' && matrix.c.pacotes_sistema
        env:
          PACOTES: ${{ matrix.c.pacotes_sistema }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          # shellcheck disable=SC2086 # uma palavra por pacote, de proposito
          sudo apt-get install -y -q --no-install-recommends $PACOTES

      # ---------------------------------------------------------------- dotnet
      - name: dotnet restore
        if: matrix.c.linguagem == 'dotnet'
        run: dotnet restore ${{ matrix.c.projeto || '' }}

      - name: dotnet build
        if: matrix.c.linguagem == 'dotnet'
        # --no-restore para que o passo de cima signifique alguma coisa: sem
        # isto o build restaura de novo e o cache nao aparece no tempo.
        run: dotnet build ${{ matrix.c.projeto || '' }} -c Release --no-restore

      - name: dotnet test
        if: matrix.c.linguagem == 'dotnet'
        run: |
          dotnet test ${{ matrix.c.projeto || '' }} -c Release --no-build \
            --logger "trx;LogFileName=testes.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./resultados

      # ---------------------------------------------------------------- python
      - name: Instalar dependencias
        if: matrix.c.linguagem == 'python'
        # As dependencias DO PROJETO entram como ele as declara: fixar versao ou
        # exigir wheel e decisao do requirements.txt dele, e `pip install -e .`
        # e o proprio projeto, que nao tem wheel por definicao. O Sonar aponta
        # essas linhas (S8544, S8541); a resposta esta no repositorio da
        # aplicacao, nao aqui. As FERRAMENTAS desta esteira, sim: versao fixa e
        # so wheel — sdist executa setup.py na instalacao.
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true
          fi
          for arquivo in requirements.txt requirements-dev.txt; do
            if [ -f "$arquivo" ]; then pip install -r "$arquivo"; fi
          done
          pip install --only-binary ':all:' ruff==0.16.7 pytest==9.1.1 pytest-cov==7.1.0

      - name: ruff check
        if: matrix.c.linguagem == 'python'
        # `check` e `format --check` em passos separados: a mensagem de falha
        # diz qual dos dois foi, e sao coisas diferentes — um e defeito de
        # codigo, o outro e formatacao.
        run: ruff check .

      - name: ruff format --check
        if: matrix.c.linguagem == 'python'
        run: ruff format --check .

      - name: pytest
        if: matrix.c.linguagem == 'python'
        run: pytest -q --cov --cov-report=xml:resultados/coverage.xml

      # ------------------------------------------------------------------ node
      - name: npm ci
        if: matrix.c.linguagem == 'node'
        # --ignore-scripts por padrao. Script de instalacao roda na maquina do
        # CI antes de qualquer teste, com o que o job enxerga; e o vetor
        # classico de pacote npm comprometido. O que a aplicacao importa nos
        # testes continua rodando — isto tira o que roda SEM ninguem chamar.
        # `scripts_de_instalacao: true` no componente devolve o comportamento
        # antigo, para pacote nativo que precise compilar.
        env:
          HUSKY: "0"
          SCRIPTS: ${{ matrix.c.scripts_de_instalacao == true && 'sim' || 'nao' }}
          # Lido pelo `.npmrc` do projeto, que referencia a variavel em vez de
          # trazer o token escrito. So este passo fala com o registro.
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$SCRIPTS" = "sim" ]; then
            npm ci
          else
            npm ci --ignore-scripts
          fi

      - name: npm run build
        if: matrix.c.linguagem == 'node'
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.c.projeto || '' }}" ]; then
            npm run build -w "${{ matrix.c.projeto }}"
          else
            npm run build --if-present
          fi

      - name: npm test
        if: matrix.c.linguagem == 'node'
        run: npm test --if-present

      # -------------------------------------------------------------------- go
      - name: go vet
        if: matrix.c.linguagem == 'go'
        run: go vet ${{ matrix.c.projeto || './...' }}

      - name: go test
        if: matrix.c.linguagem == 'go'
        run: |
          mkdir -p resultados
          go test ${{ matrix.c.projeto || './...' }} -race -coverprofile=resultados/cobertura.out
          # O portao le cobertura.xml/opencover/lcov; o Go escreve um formato
          # proprio. gocover-cobertura e a ponte, e e a mesma ponte que o
          # SonarQube usa para Go.
          go run github.com/boumenot/gocover-cobertura@latest \
            < resultados/cobertura.out > resultados/coverage.xml

      # ------------------------------------------------------------------ rust
      # O `target/` e o cache que paga: sem ele todo run recompila o grafo de
      # dependencias inteiro. Fica aqui, e nao em `preparar`, porque a chave
      # depende do caminho do componente — e um `uses:` ignora
      # `defaults.run.working-directory`, entao o caminho precisa estar escrito
      # no `path`.
      #
      # O runner entra na chave, e nao so o SO: o `target/` compilado no
      # ubuntu-24.04 (glibc 2.39) restaurado num ubuntu-22.04 levaria para o
      # pacote um binario que so roda na glibc nova, e o motivo de pedir o
      # 22.04 era justamente a glibc velha.
      - name: Cache do target
        if: matrix.c.linguagem == 'rust'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.c.caminho || '.' }}/target
          key: alvo-${{ runner.os }}-${{ matrix.c.so || 'ubuntu-latest' }}-${{ matrix.c.nome }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.c.caminho || '.')) }}
          restore-keys: alvo-${{ runner.os }}-${{ matrix.c.so || 'ubuntu-latest' }}-${{ matrix.c.nome }}-

      - name: Alvo do runner
        # O par SO/arquitetura do runner no vocabulario do Rust, numa tabela so,
        # lida por quem baixa binario pronto (cargo-llvm-cov, tauri-cli) e por
        # quem da nome aos arquivos dos binarios extra. `target` e onde o cargo
        # compila: num workspace e a raiz dele, nao o `caminho`. No Windows o
        # cargo responde com caminho Windows; o `cygpath` o traduz para o bash.
        # O `print(end="")` porque o python do Windows escreve `\r\n`.
        id: alvo
        if: matrix.c.linguagem == 'rust'
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) alvo=x86_64-unknown-linux-gnu; exe="" ;;
            Windows-X64) alvo=x86_64-pc-windows-msvc; exe=".exe" ;;
            *)
              echo "::error::rust: sem alvo conferido para $RUNNER_OS/$RUNNER_ARCH."
              exit 1
              ;;
          esac
          target=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"], end="")')
          if command -v cygpath >/dev/null 2>&1; then target=$(cygpath -u "$target"); fi
          {
            echo "alvo=$alvo"
            echo "exe=$exe"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"
          echo "alvo=$alvo target=$target"

      - name: cargo fmt --check
        if: matrix.c.linguagem == 'rust'
        # Formatacao e defeito de codigo sao coisas diferentes, e cada uma no seu
        # passo: a tela de falha diz qual foi sem ninguem abrir o log.
        run: cargo fmt --all -- --check

      - name: Instalar cargo-audit
        if: matrix.c.linguagem == 'rust' && matrix.c.auditoria == true
        # Binario pronto, versao fixa e hash conferido — o mesmo argumento do
        # cargo-llvm-cov, logo abaixo. `cargo install cargo-audit` compilaria a
        # ferramenta por minutos, e na versao que o crates.io tiver hoje. O
        # sha256 e o `digest` da release cargo-audit/v0.22.2 no GitHub.
        env:
          VERSAO_AUDIT: "0.22.2"
          SHA256_AUDIT: "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39"
        run: |
          set -euo pipefail
          if [ "$RUNNER_ARCH" != "X64" ]; then
            echo "::error::cargo-audit: so ha binario conferido para Linux X64 (este e $RUNNER_ARCH)."
            exit 1
          fi
          nome="cargo-audit-x86_64-unknown-linux-gnu-v${VERSAO_AUDIT}"
          tmp=$(mktemp -d)
          curl --proto '=https' --tlsv1.2 -fsSL -o "$tmp/$nome.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${VERSAO_AUDIT}/${nome}.tgz"
          echo "${SHA256_AUDIT}  $tmp/$nome.tgz" | sha256sum -c -
          tar xzf "$tmp/$nome.tgz" -C "$tmp"
          install -m 0755 "$tmp/$nome/cargo-audit" "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-audit"
          cargo audit --version

      - name: cargo audit
        if: matrix.c.linguagem == 'rust' && matrix.c.auditoria == true
        # Antes do clippy: leva segundos, e dependencia vulneravel e motivo para
        # parar antes de dez minutos de compilacao. Le o Cargo.lock e o
        # `.cargo/audit.toml` do `caminho`: cada excecao e do repositorio que a
        # assume, com o motivo escrito la. Sem `--ignore`, sem `|| true`:
        # vulnerabilidade que o chamador nao ignorou reprova.
        run: cargo audit

      - name: cargo clippy
        if: matrix.c.linguagem == 'rust'
        # `-D warnings` transforma lint em erro. Sem isso o clippy vira decoracao:
        # ninguem le aviso em log verde.
        # `--all-targets` inclui testes, exemplos e benches — onde o codigo
        # descuidado costuma morar.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Instalar cargo-llvm-cov
        if: matrix.c.linguagem == 'rust'
        # Binario pronto em vez de `cargo install`: compilar a ferramenta leva
        # perto de dois minutos e ela nao e o que estamos testando.
        #
        # A VERSAO E FIXA, e nao `latest/download`. Mesmo argumento dos SHAs das
        # actions em actions.lock.json: `latest` e ponteiro movel, e quem publica
        # decide o que roda aqui dentro. Para subir, troque o numero E os dois
        # hashes, e abra PR.
        #
        # O pacote e o do SO do runner — a v0.9.1 publica .tar.gz para Linux e
        # para Windows —, e o sha256 e o `digest` de cada um na release: a
        # versao diz o que baixar, o hash prova que chegou isso. Arquivo que
        # nao bate nao e extraido. No Windows o CARGO_HOME e caminho Windows
        # (C:\...); o `cygpath` o traduz para o tar do Git Bash.
        env:
          VERSAO_LLVM_COV: "0.9.1"
          SHA256_LINUX: "b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a"
          SHA256_WINDOWS: "15eefd5b90fcdd4006b727c6e710d70a61aff509fcd7bb37f9c2a35c4f024948"
          ALVO: ${{ steps.alvo.outputs.alvo }}
        run: |
          set -euo pipefail
          case "$ALVO" in
            x86_64-unknown-linux-gnu) sha256=$SHA256_LINUX ;;
            x86_64-pc-windows-msvc) sha256=$SHA256_WINDOWS ;;
            *)
              echo "::error::cargo-llvm-cov: sem binario conferido para $ALVO."
              exit 1
              ;;
          esac
          destino="${CARGO_HOME:-$HOME/.cargo}/bin"
          if command -v cygpath >/dev/null 2>&1; then destino=$(cygpath -u "$destino"); fi
          arquivo="$(mktemp -d)/cargo-llvm-cov.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$arquivo" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${VERSAO_LLVM_COV}/cargo-llvm-cov-${ALVO}.tar.gz"
          echo "${sha256}  ${arquivo}" | sha256sum -c -
          tar xzf "$arquivo" -C "$destino"
          cargo llvm-cov --version

      - name: cargo test com cobertura
        if: matrix.c.linguagem == 'rust'
        # `cargo llvm-cov` JA roda os testes: um `cargo test` antes disso seria
        # a mesma suite duas vezes. Cobertura em LCOV porque e o que o portao
        # desta esteira le e o que o Sonar importa em
        # `sonar.rust.lcov.reportPaths`.
        env:
          PACOTE: ${{ matrix.c.projeto && format('--package {0}', matrix.c.projeto) || '--workspace' }}
        run: |
          set -euo pipefail
          mkdir -p resultados
          # shellcheck disable=SC2086
          cargo llvm-cov --all-features $PACOTE \
            --lcov --output-path resultados/lcov.info

      - name: Carimbar versao
        if: matrix.c.linguagem == 'rust' && matrix.c.carimbar_versao == true
        # O repositorio guarda `0.0.0`, e a versao do produto so existe neste
        # run: nenhum commit de bot na main, a mesma ideia do `helm package
        # --version` do helm-charts. Antes do build de release, para que o
        # binario, o `--version` e os pacotes do Tauri (que leem a versao do
        # crate) saiam com ela. Os testes acima rodaram com o `0.0.0`.
        #
        # So o `version` da secao `[workspace.package]` do Cargo.toml do
        # `caminho` (ou do `[package]`, sem workspace) muda. O Cargo.lock
        # acompanha com `cargo update --workspace --offline`, que so reescreve
        # os membros e nao consulta a rede (medido no ddc-control: as quatro
        # linhas `version` dos membros e mais nada). Sem isso o `--locked` do
        # build reprovaria. A trava confere o diff: pacote de registro que
        # mudasse de versao mudaria o `checksum` junto, e git dependency, o
        # `source` — qualquer linha alem de `version = ...` reprova.
        env:
          VERSAO_PRODUTO: ${{ inputs.versao }}
        run: |
          set -euo pipefail
          secao='[package]'
          if grep -qE '^\[workspace\.package\]' Cargo.toml; then secao='[workspace.package]'; fi
          novo="$RUNNER_TEMP/Cargo.toml.carimbado"
          if ! awk -v versao="$VERSAO_PRODUTO" -v secao="$secao" '
            /^\[/ { dentro = (index($0, secao) == 1) }
            dentro && !feito && /^version[[:space:]]*=/ { print "version = \"" versao "\""; feito = 1; next }
            { print }
            END { if (!feito) exit 3 }
          ' Cargo.toml > "$novo"; then
            echo "::error::carimbar_versao: nenhuma linha version em $secao do Cargo.toml."
            exit 1
          fi
          cat "$novo" > Cargo.toml
          cargo update --workspace --offline
          git --no-pager diff -- Cargo.toml Cargo.lock
          mudou=$(git diff --numstat -- Cargo.toml | cut -f1,2)
          if [ -n "$mudou" ] && [ "$mudou" != "$(printf '1\t1')" ]; then
            echo "::error::carimbar_versao: o Cargo.toml mudou em mais de uma linha."
            exit 1
          fi
          fora=$(git diff -U0 -- Cargo.lock | grep -E '^[-+]' | grep -vE '^(---|\+\+\+) ' |
            grep -vE '^[-+]version = "' || true)
          if [ -n "$fora" ]; then
            echo "::error::carimbar_versao: o Cargo.lock mudou alem das versoes dos membros:"
            printf '%s\n' "$fora"
            exit 1
          fi
          echo "Versao $VERSAO_PRODUTO carimbada em $secao."

      - name: ${{ matrix.c.build_release && format('Build {0} (release)', matrix.c.build_release) || 'Build de release' }}
        if: matrix.c.linguagem == 'rust' && matrix.c.build_release
        # Depois dos testes: e o passo mais longo, e so vale a pena com o
        # codigo ja aprovado. `--locked` porque o binario de producao tem de
        # sair do Cargo.lock versionado, e nao de uma resolucao nova.
        # Com o campo, o nome e `Build <pacote> (release)`, e quem chama pode
        # consultar o passo por ele. O `format` so monta esse nome com o campo
        # preenchido: sem ele, o passo pulado apareceria como `Build  (release)`.
        env:
          PACOTE_RELEASE: ${{ matrix.c.build_release }}
        run: cargo build -p "$PACOTE_RELEASE" --release --locked

      - name: Build binarios extra (release)
        if: matrix.c.linguagem == 'rust' && matrix.c.binarios_extra
        # Os binarios que vao para a release ao lado dos pacotes, no mesmo
        # perfil e com o mesmo Cargo.lock do build acima.
        env:
          BINARIOS_EXTRA: ${{ matrix.c.binarios_extra }}
        run: |
          set -euo pipefail
          pacotes=()
          for pacote in $BINARIOS_EXTRA; do pacotes+=(-p "$pacote"); done
          cargo build "${pacotes[@]}" --release --locked

      - name: Conferir versao dos binarios
        if: >-
          matrix.c.linguagem == 'rust' && matrix.c.carimbar_versao == true
          && matrix.c.binarios_extra
        # A prova de que o carimbo chegou ao binario: ele EXECUTA e diz a
        # versao. No Windows roda o `.exe` de verdade. Espacos em volta na
        # comparacao, para `10.1.0` nao passar por `0.1.0`.
        env:
          BINARIOS_EXTRA: ${{ matrix.c.binarios_extra }}
          VERSAO_PRODUTO: ${{ inputs.versao }}
          TARGET: ${{ steps.alvo.outputs.target }}
          EXE: ${{ steps.alvo.outputs.exe }}
        run: |
          set -euo pipefail
          for binario in $BINARIOS_EXTRA; do
            saida=$("$TARGET/release/$binario$EXE" --version)
            echo "$binario$EXE --version: $saida"
            if [[ " $saida " != *" $VERSAO_PRODUTO "* ]]; then
              echo "::error::$binario$EXE --version nao diz $VERSAO_PRODUTO."
              exit 1
            fi
          done

      - name: Empacotar binarios extra
        if: matrix.c.linguagem == 'rust' && matrix.c.binarios_extra
        # `<bin>-<alvo>.tar.gz` no Linux e `.zip` no Windows, com o binario e o
        # LICENSE da raiz e mais nada: sem diretorio, sem `./` na frente. Quem
        # baixa um binario solto, fora de pacote de distro, precisa da licenca
        # ao lado. No Git Bash nao ha `zip`; o 7-Zip da imagem do runner faz o
        # arquivo. O tar sai sem o usuario do runner (`--owner=0`).
        working-directory: .
        env:
          BINARIOS_EXTRA: ${{ matrix.c.binarios_extra }}
          ALVO: ${{ steps.alvo.outputs.alvo }}
          EXE: ${{ steps.alvo.outputs.exe }}
          TARGET: ${{ steps.alvo.outputs.target }}
        run: |
          set -euo pipefail
          if [ ! -f LICENSE ]; then
            echo "::error::binarios_extra: falta o LICENSE na raiz do repositorio, que vai junto de cada binario."
            exit 1
          fi
          mkdir -p dist
          for binario in $BINARIOS_EXTRA; do
            estagio=$(mktemp -d)
            cp "$TARGET/release/$binario$EXE" LICENSE "$estagio/"
            if [ "$RUNNER_OS" = "Windows" ]; then
              arquivo="$PWD/dist/$binario-$ALVO.zip"
              (cd "$estagio" && 7z a -tzip -bd -bso0 "$(cygpath -w "$arquivo")" "$binario$EXE" LICENSE)
              7z l -ba "$(cygpath -w "$arquivo")"
            else
              arquivo="$PWD/dist/$binario-$ALVO.tar.gz"
              tar --owner=0 --group=0 --numeric-owner -czf "$arquivo" -C "$estagio" "$binario" LICENSE
              tar -tvzf "$arquivo"
            fi
          done

      - name: Instalar tauri-cli
        if: matrix.c.linguagem == 'rust' && matrix.c.empacotar_tauri == true
        # Binario pronto, versao fixa e hash conferido, como o cargo-llvm-cov:
        # `cargo install tauri-cli` compilaria a ferramenta por minutos, na
        # versao que o crates.io tiver hoje. A 2.12.0 e a minor do crate
        # `tauri` do ddc-control; os sha256 sao o `digest` de cada arquivo na
        # release tauri-cli-v2.12.0. O binario Linux pede no maximo
        # GLIBC_2.34 (objdump -T), entao roda no ubuntu-22.04. O .zip do
        # Windows abre com o mesmo 7-Zip que empacota os binarios extra.
        env:
          VERSAO_TAURI: "2.12.0"
          SHA256_LINUX: "8544e19c4312f653e80f92241ee4212b4d928ad33461bfb1d2997c52560c418f"
          SHA256_WINDOWS: "78785c9b574bbe4bbfe6cc3008422df068a0f661931a9fa9d13d08407604b6a9"
          ALVO: ${{ steps.alvo.outputs.alvo }}
        run: |
          set -euo pipefail
          case "$ALVO" in
            x86_64-unknown-linux-gnu) extensao=tgz; sha256=$SHA256_LINUX ;;
            x86_64-pc-windows-msvc) extensao=zip; sha256=$SHA256_WINDOWS ;;
            *)
              echo "::error::tauri-cli: sem binario conferido para $ALVO."
              exit 1
              ;;
          esac
          destino="${CARGO_HOME:-$HOME/.cargo}/bin"
          if command -v cygpath >/dev/null 2>&1; then destino=$(cygpath -u "$destino"); fi
          arquivo="$(mktemp -d)/cargo-tauri.$extensao"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$arquivo" \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${VERSAO_TAURI}/cargo-tauri-${ALVO}.${extensao}"
          echo "${sha256}  ${arquivo}" | sha256sum -c -
          if [ "$extensao" = "zip" ]; then
            7z e -y -bd -bso0 "-o$(cygpath -w "$destino")" "$(cygpath -w "$arquivo")" cargo-tauri.exe
          else
            tar xzf "$arquivo" -C "$destino" cargo-tauri
          fi
          cargo tauri --version

      - name: ${{ matrix.c.empacotar_tauri == true && format('Empacotar {0} (Tauri)', matrix.c.build_release) || 'Empacotar app Tauri' }}
        if: matrix.c.linguagem == 'rust' && matrix.c.empacotar_tauri == true
        # Os instaladores do SO do runner: deb, rpm e AppImage no Linux; msi e
        # NSIS no Windows. O conjunto nao e campo, porque os bundlers validos
        # ja sao 1:1 com o SO. `--locked` vai para o cargo, depois do `--`.
        #
        # O `bundle/` sai do `target/` antes: o cache do target traz os pacotes
        # de runs anteriores, com outra versao no nome. Depois, cada bundler
        # tem de ter produzido EXATAMENTE um arquivo, e ele vai para `dist/`
        # com o nome do produto em minusculas e `-` no lugar de espaco (o
        # Tauri usa o `productName`, `DDC Control_0.1.0_amd64.deb`): nome com
        # espaco quebra linha de comando de quem baixa. Nome sem a versao do
        # crate reprova, porque a versao no nome e o que diz o que e o arquivo.
        # O nome do passo so leva o pacote com o campo ligado.
        working-directory: .
        env:
          CAMINHO_TAURI: ${{ matrix.c.caminho_tauri }}
          PACOTE_RELEASE: ${{ matrix.c.build_release }}
          TARGET: ${{ steps.alvo.outputs.target }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) bundles="deb rpm appimage" ;;
            Windows) bundles="msi nsis" ;;
            *)
              echo "::error::empacotar_tauri: sem bundler conferido para $RUNNER_OS."
              exit 1
              ;;
          esac
          versao=$(cd "$CAMINHO_TAURI" && cargo metadata --no-deps --format-version 1 --offline |
            python3 -c 'import json, os, sys
          v = [p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == os.environ["PACOTE_RELEASE"]]
          print(v[0] if len(v) == 1 else "", end="")')
          if [ -z "$versao" ]; then
            echo "::error::empacotar_tauri: o pacote $PACOTE_RELEASE nao esta no workspace."
            exit 1
          fi
          bundle="$TARGET/release/bundle"
          rm -rf "$bundle"
          (cd "$CAMINHO_TAURI" && cargo tauri build --ci --bundles "${bundles// /,}" -- --locked)
          mkdir -p dist
          re_nome="^(.+)([_-]${versao//./\\.}[_-].*)$"
          for bundler in $bundles; do
            case "$bundler" in
              deb) padrao='*.deb' ;;
              rpm) padrao='*.rpm' ;;
              appimage) padrao='*.AppImage' ;;
              msi) padrao='*.msi' ;;
              nsis) padrao='*-setup.exe' ;;
            esac
            mapfile -t achados < <(find "$bundle/$bundler" -maxdepth 1 -type f -name "$padrao")
            if [ "${#achados[@]}" != 1 ]; then
              echo "::error::$bundler: esperado 1 arquivo $padrao, achados ${#achados[@]}."
              exit 1
            fi
            nome=$(basename "${achados[0]}")
            if ! [[ $nome =~ $re_nome ]]; then
              echo "::error::$bundler: $nome nao tem a versao $versao no nome."
              exit 1
            fi
            produto=${BASH_REMATCH[1],,}
            publicado="${produto// /-}${BASH_REMATCH[2]}"
            if [[ $publicado == *" "* ]]; then
              echo "::error::$bundler: $publicado ainda tem espaco no nome."
              exit 1
            fi
            mv "${achados[0]}" "dist/$publicado"
            echo "$bundler: $nome -> dist/$publicado"
          done
          rm -rf "$bundle"

      - name: Guardar pacotes
        if: >-
          matrix.c.linguagem == 'rust'
          && (matrix.c.empacotar_tauri == true || matrix.c.binarios_extra)
        # O contrato com o `lancar.yml`: `artefatos: "pacotes-*"` baixa todos os
        # `pacotes-<nome>` do run e os anexa a release. Arquivos soltos na raiz
        # do artefato. Empacotamento ligado que nao produz nada e falha, nunca
        # um artefato vazio.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pacotes-${{ matrix.c.nome }}
          path: dist/*
          if-no-files-found: error

      # --------------------------------------------------------------- comum --
      - name: Cobertura
        # `always()`: sem isto, teste vermelho pula o relatorio e some a unica
        # tela que diz o quanto do codigo foi exercitado antes de quebrar.
        if: always()
        uses: slipalison/github-workflows/.github/actions/relatar-cobertura@main
        with:
          relatorios: >-
            ${{ matrix.c.caminho || '.' }}/resultados/**/coverage.xml
            ${{ matrix.c.caminho || '.' }}/resultados/**/coverage.cobertura.xml
            ${{ matrix.c.caminho || '.' }}/resultados/**/*.opencover.xml
            ${{ matrix.c.caminho || '.' }}/resultados/**/lcov.info
            ${{ matrix.c.caminho || '.' }}/coverage/lcov.info
          minimo: ${{ matrix.c.cobertura || 0 }}

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resultados-${{ matrix.c.nome }}
          path: |
            ${{ matrix.c.caminho || '.' }}/resultados
            ${{ matrix.c.caminho || '.' }}/coverage
          retention-days: 7
          if-no-files-found: ignore
