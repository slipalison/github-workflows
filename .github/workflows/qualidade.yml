name: Qualidade

# Lint, testes e cobertura — um job POR COMPONENTE, todos em paralelo.
#
# O QUE ESTE ARQUIVO CORRIGE
# --------------------------
# O `simulator-ccb` tem `backend-build` e, com `needs: backend-build`,
# `backend-tests`. O job de build nao sobe artefato nenhum — entao o de teste
# refaz `restore` e `build` do zero. O `needs` ali nao economiza trabalho: ele
# so SERIALIZA dois builds identicos. O mesmo acontece com os dois frontends.
# Sao tres pares, seis builds, tres esperas — para nada.
#
# Aqui build e teste vivem no MESMO job (o build ja e pre-requisito do teste,
# nao ha o que paralelizar entre eles) e o que corre em paralelo sao os
# COMPONENTES, que de fato nao dependem um do outro.
#
# Um componente e um objeto JSON:
#   nome         rotulo do job e do artefato
#   linguagem    dotnet | python | node | go | rust
#   versao       opcional; vazio = padrao da action `preparar`
#   caminho      diretorio de trabalho, padrao "."
#   projeto      dotnet: .sln/.slnx/.csproj | node: workspace | go: ./...
#                rust: pacote do workspace (--package); vazio = --workspace
#   cobertura    piso em %; 0 (padrao) desliga o portao daquele componente
#   scripts_de_instalacao
#                node: true deixa o `npm ci` rodar os scripts de instalacao
#                das dependencias (postinstall e afins). O padrao e
#                --ignore-scripts: um pacote comprometido executa na instalacao,
#                antes de qualquer teste. Ligue so se algum pacote nativo
#                precisar compilar — e saiba qual.

on:
  workflow_call:
    inputs:
      componentes:
        description: "JSON array de componentes. Ver o cabecalho deste arquivo."
        required: false
        type: string
        default: '[{"nome":"app","linguagem":"python"}]'
      timeout:
        required: false
        type: number
        default: 20
    secrets:
      GH_PACKAGES_TOKEN:
        description: >-
          Token de LEITURA do npm do GitHub (`read:packages`), para componente
          node que dependa de pacote privado do proprio dono. So o `npm ci`
          precisa dele: `build` e `test` nao falam com o registro, e o npm
          tolera a variavel ausente no `.npmrc` (medido no npm 11). Opcional.
        required: false

permissions:
  contents: read

jobs:
  qualidade:
    # `nome` no rotulo: com matriz, sem isto a tela mostra "qualidade (Object)"
    # em todos os jobs e nao da para saber qual falhou sem abrir cada um.
    name: ${{ matrix.c.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
    strategy:
      # fail-fast: false. O padrao mata os outros componentes quando um falha, e
      # aparece so o primeiro erro; com tres componentes isso vira tres rodadas
      # de CI para descobrir tres problemas que dava para ver de uma vez.
      fail-fast: false
      matrix:
        c: ${{ fromJSON(inputs.componentes) }}
    defaults:
      run:
        working-directory: ${{ matrix.c.caminho || '.' }}
    steps:
      - name: Preparar
        uses: slipalison/github-workflows/.github/actions/preparar@main
        with:
          linguagem: ${{ matrix.c.linguagem }}
          versao: ${{ matrix.c.versao || '' }}

      # ---------------------------------------------------------------- dotnet
      - name: dotnet restore
        if: matrix.c.linguagem == 'dotnet'
        run: dotnet restore ${{ matrix.c.projeto || '' }}

      - name: dotnet build
        if: matrix.c.linguagem == 'dotnet'
        # --no-restore para que o passo de cima signifique alguma coisa: sem
        # isto o build restaura de novo e o cache nao aparece no tempo.
        run: dotnet build ${{ matrix.c.projeto || '' }} -c Release --no-restore

      - name: dotnet test
        if: matrix.c.linguagem == 'dotnet'
        run: |
          dotnet test ${{ matrix.c.projeto || '' }} -c Release --no-build \
            --logger "trx;LogFileName=testes.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./resultados

      # ---------------------------------------------------------------- python
      - name: Instalar dependencias
        if: matrix.c.linguagem == 'python'
        # As dependencias DO PROJETO entram como ele as declara: fixar versao ou
        # exigir wheel e decisao do requirements.txt dele, e `pip install -e .`
        # e o proprio projeto, que nao tem wheel por definicao. O Sonar aponta
        # essas linhas (S8544, S8541); a resposta esta no repositorio da
        # aplicacao, nao aqui. As FERRAMENTAS desta esteira, sim: versao fixa e
        # so wheel — sdist executa setup.py na instalacao.
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true
          fi
          for arquivo in requirements.txt requirements-dev.txt; do
            if [ -f "$arquivo" ]; then pip install -r "$arquivo"; fi
          done
          pip install --only-binary ':all:' ruff==0.16.7 pytest==9.1.1 pytest-cov==7.1.0

      - name: ruff check
        if: matrix.c.linguagem == 'python'
        # `check` e `format --check` em passos separados: a mensagem de falha
        # diz qual dos dois foi, e sao coisas diferentes — um e defeito de
        # codigo, o outro e formatacao.
        run: ruff check .

      - name: ruff format --check
        if: matrix.c.linguagem == 'python'
        run: ruff format --check .

      - name: pytest
        if: matrix.c.linguagem == 'python'
        run: pytest -q --cov --cov-report=xml:resultados/coverage.xml

      # ------------------------------------------------------------------ node
      - name: npm ci
        if: matrix.c.linguagem == 'node'
        # --ignore-scripts por padrao. Script de instalacao roda na maquina do
        # CI antes de qualquer teste, com o que o job enxerga; e o vetor
        # classico de pacote npm comprometido. O que a aplicacao importa nos
        # testes continua rodando — isto tira o que roda SEM ninguem chamar.
        # `scripts_de_instalacao: true` no componente devolve o comportamento
        # antigo, para pacote nativo que precise compilar.
        env:
          HUSKY: "0"
          SCRIPTS: ${{ matrix.c.scripts_de_instalacao == true && 'sim' || 'nao' }}
          # Lido pelo `.npmrc` do projeto, que referencia a variavel em vez de
          # trazer o token escrito. So este passo fala com o registro.
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$SCRIPTS" = "sim" ]; then
            npm ci
          else
            npm ci --ignore-scripts
          fi

      - name: npm run build
        if: matrix.c.linguagem == 'node'
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.c.projeto || '' }}" ]; then
            npm run build -w "${{ matrix.c.projeto }}"
          else
            npm run build --if-present
          fi

      - name: npm test
        if: matrix.c.linguagem == 'node'
        run: npm test --if-present

      # -------------------------------------------------------------------- go
      - name: go vet
        if: matrix.c.linguagem == 'go'
        run: go vet ${{ matrix.c.projeto || './...' }}

      - name: go test
        if: matrix.c.linguagem == 'go'
        run: |
          mkdir -p resultados
          go test ${{ matrix.c.projeto || './...' }} -race -coverprofile=resultados/cobertura.out
          # O portao le cobertura.xml/opencover/lcov; o Go escreve um formato
          # proprio. gocover-cobertura e a ponte, e e a mesma ponte que o
          # SonarQube usa para Go.
          go run github.com/boumenot/gocover-cobertura@latest \
            < resultados/cobertura.out > resultados/coverage.xml

      # ------------------------------------------------------------------ rust
      # O `target/` e o cache que paga: sem ele todo run recompila o grafo de
      # dependencias inteiro. Fica aqui, e nao em `preparar`, porque a chave
      # depende do caminho do componente — e um `uses:` ignora
      # `defaults.run.working-directory`, entao o caminho precisa estar escrito
      # no `path`.
      - name: Cache do target
        if: matrix.c.linguagem == 'rust'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.c.caminho || '.' }}/target
          key: alvo-${{ runner.os }}-${{ matrix.c.nome }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.c.caminho || '.')) }}
          restore-keys: alvo-${{ runner.os }}-${{ matrix.c.nome }}-

      - name: cargo fmt --check
        if: matrix.c.linguagem == 'rust'
        # Formatacao e defeito de codigo sao coisas diferentes, e cada uma no seu
        # passo: a tela de falha diz qual foi sem ninguem abrir o log.
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.c.linguagem == 'rust'
        # `-D warnings` transforma lint em erro. Sem isso o clippy vira decoracao:
        # ninguem le aviso em log verde.
        # `--all-targets` inclui testes, exemplos e benches — onde o codigo
        # descuidado costuma morar.
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Instalar cargo-llvm-cov
        if: matrix.c.linguagem == 'rust'
        # Binario pronto em vez de `cargo install`: compilar a ferramenta leva
        # perto de dois minutos e ela nao e o que estamos testando.
        #
        # A VERSAO E FIXA, e nao `latest/download`. Mesmo argumento dos SHAs das
        # actions em actions.lock.json: `latest` e ponteiro movel, e quem publica
        # decide o que roda aqui dentro. Para subir, troque o numero e abra PR.
        env:
          VERSAO_LLVM_COV: "0.9.1"
        run: |
          set -euo pipefail
          url="https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${VERSAO_LLVM_COV}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "$url" | tar xzf - -C "$HOME/.cargo/bin"
          cargo llvm-cov --version

      - name: cargo test com cobertura
        if: matrix.c.linguagem == 'rust'
        # `cargo llvm-cov` JA roda os testes: um `cargo test` antes disso seria
        # a mesma suite duas vezes. Cobertura em LCOV porque e o que o portao
        # desta esteira le e o que o Sonar importa em
        # `sonar.rust.lcov.reportPaths`.
        env:
          PACOTE: ${{ matrix.c.projeto && format('--package {0}', matrix.c.projeto) || '--workspace' }}
        run: |
          set -euo pipefail
          mkdir -p resultados
          # shellcheck disable=SC2086
          cargo llvm-cov --all-features $PACOTE \
            --lcov --output-path resultados/lcov.info

      # --------------------------------------------------------------- comum --
      - name: Cobertura
        # `always()`: sem isto, teste vermelho pula o relatorio e some a unica
        # tela que diz o quanto do codigo foi exercitado antes de quebrar.
        if: always()
        uses: slipalison/github-workflows/.github/actions/relatar-cobertura@main
        with:
          relatorios: >-
            ${{ matrix.c.caminho || '.' }}/resultados/**/coverage.xml
            ${{ matrix.c.caminho || '.' }}/resultados/**/coverage.cobertura.xml
            ${{ matrix.c.caminho || '.' }}/resultados/**/*.opencover.xml
            ${{ matrix.c.caminho || '.' }}/resultados/**/lcov.info
            ${{ matrix.c.caminho || '.' }}/coverage/lcov.info
          minimo: ${{ matrix.c.cobertura || 0 }}

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resultados-${{ matrix.c.nome }}
          path: |
            ${{ matrix.c.caminho || '.' }}/resultados
            ${{ matrix.c.caminho || '.' }}/coverage
          retention-days: 7
          if-no-files-found: ignore
