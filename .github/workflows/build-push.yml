name: Build, varredura e push

# Chamado pelo CI de cada aplicacao. Faz a imagem, varre por vulnerabilidade e
# devolve a tag que o deploy vai escrever no GitOps.
on:
  workflow_call:
    inputs:
      image:
        description: "Nome da imagem sem tag, ex.: ghcr.io/slipalison/meu-app"
        required: true
        type: string
      context:
        description: "Diretorio de build"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Caminho do Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      platforms:
        required: false
        type: string
        default: "linux/amd64"
      trivyignores:
        description: "Arquivo de excecoes do Trivy; vazio = nenhum"
        required: false
        type: string
        default: ""
    outputs:
      tag:
        description: "Tag publicada (sha-<7>)"
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag a partir do commit
        id: meta
        # sha-<7> e reproduzivel e diz de onde veio. 'latest' nao diz nada e o
        # Kyverno recusa no cluster.
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Varredura de vulnerabilidades
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          # So CRITICAL derruba o build. HIGH aparece no log e vira trabalho
          # planejado; derrubar tudo ensina o time a ignorar o relatorio.
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          # Vazio por padrao. Apontar para um arquivo que nao existe nao e
          # ignorado pelo Trivy: ele sai com "cannot find ignorefile" e derruba
          # o job — um repositorio sem excecoes nao conseguia usar este workflow.
          trivyignores: ${{ inputs.trivyignores }}
        env:
          TRIVY_SEVERITY: CRITICAL
