name: Build, varredura e push

# Chamado pelo CI de cada aplicacao. Faz a imagem, varre por vulnerabilidade e
# devolve a tag que o deploy vai escrever no GitOps.
on:
  workflow_call:
    inputs:
      image:
        description: "Nome da imagem sem tag, ex.: ghcr.io/slipalison/meu-app"
        required: true
        type: string
      context:
        description: "Diretorio de build"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Caminho do Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      platforms:
        required: false
        type: string
        default: "linux/amd64"
      trivyignores:
        description: "Arquivo de excecoes do Trivy; vazio = nenhum"
        required: false
        type: string
        default: ""
      severidade_bloqueante:
        description: "Severidades que derrubam o build"
        required: false
        type: string
        default: "CRITICAL"
    outputs:
      tag:
        description: "Tag publicada (sha-<7>)"
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag a partir do commit
        id: meta
        # sha-<7> e reproduzivel e diz de onde veio. 'latest' nao diz nada e o
        # Kyverno recusa no cluster.
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # DOIS passos, e nao um com severidade dupla. O trivy-action da
      # precedencia a `severity` (entrada) sobre TRIVY_SEVERITY (ambiente),
      # entao a versao anterior dizia no comentario que so CRITICAL derrubava e
      # derrubava HIGH tambem. Separado, cada passo tem um proposito so.
      - name: Relatorio de vulnerabilidades (nao derruba)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: ${{ inputs.trivyignores }}

      - name: Portao de seguranca (CRITICAL derruba)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          format: table
          severity: ${{ inputs.severidade_bloqueante }}
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: ${{ inputs.trivyignores }}
