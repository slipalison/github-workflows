name: Imagem

# Constroi, varre e publica. Devolve a tag que o deploy escreve no GitOps.
#
# A ORDEM IMPORTA
# ---------------
# A versao anterior publicava e so depois varria. Uma imagem com CRITICAL
# chegava ao GHCR — publica, no caso deste dono — e ficava la mesmo com o job
# vermelho. Nao chegava ao cluster (quem impede isso e o `publicar`), mas estava
# no registro, acessivel.
#
# Agora, quando ha uma plataforma so — o caso normal aqui —, a imagem e
# carregada no daemon local, varrida, e SO ENTAO publicada. O segundo `build`
# nao reconstroi nada: o layer ja esta no cache do buildx, entao custa segundos.
# Em multi-plataforma isso nao existe (`load` nao aceita mais de uma), e ai o
# caminho antigo volta, com o portao valendo igual.

on:
  workflow_call:
    inputs:
      image:
        description: "Nome da imagem sem tag, ex.: ghcr.io/slipalison/meu-app"
        required: true
        type: string
      context:
        required: false
        type: string
        default: "."
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      platforms:
        required: false
        type: string
        default: "linux/amd64"
      trivyignores:
        description: "Arquivo de excecoes do Trivy; vazio = nenhum"
        required: false
        type: string
        default: ""
      severidade_bloqueante:
        description: "Severidades que derrubam o build"
        required: false
        type: string
        default: "CRITICAL"
      publicar_sarif:
        description: "auto (publico sim, privado nao) | sempre | nunca"
        required: false
        type: string
        default: "auto"
    outputs:
      tag:
        description: "Tag publicada (sha-<7>)"
        value: ${{ jobs.build.outputs.tag }}
      digest:
        description: "Digest da imagem publicada, para referencia imutavel"
        value: ${{ jobs.build.outputs.digest }}
    secrets:
      GH_PACKAGES_TOKEN:
        description: >-
          Token de LEITURA do npm do GitHub (`read:packages`), para Dockerfile
          que instala pacote privado do proprio dono. Chega ao build como
          secret do BuildKit com id `npm_token`, NUNCA como `build-arg`:
          build-arg fica gravado no historico da imagem e sai inteiro num
          `docker history`. Opcional — repositorio que nao consome pacote
          privado nao declara, e o secret chega vazio sem quebrar nada.
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Imagem
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.publicar.outputs.digest }}
    steps:
      - name: Preparar
        uses: slipalison/github-workflows/.github/actions/preparar@main

      - name: Tag a partir do commit
        id: meta
        env:
          PLATAFORMAS: ${{ inputs.platforms }}
          IMAGEM: ${{ inputs.image }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # sha-<7> e reproduzivel e diz de onde veio. `latest` nao diz nada, nao
          # permite rollback, e o Kyverno recusa no cluster.
          tag="sha-$(git rev-parse --short=7 HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # AMBIENTE DE PREVIEW. Num pull request a imagem ganha um segundo nome,
          # `pr-<numero>-<7 do head do PR>`, apontando para o MESMO digest.
          #
          # Por que nao basta o sha-: aqui o HEAD e o merge commit que o GitHub
          # monta (PR + base), e o gerador de pull request do ArgoCD so conhece o
          # SHA do HEAD DO PR. Sem um nome que os dois lados saibam calcular, o
          # ApplicationSet `previews` do homelab-gitops pediria uma tag que nao
          # existe. O conteudo continua sendo o do merge commit — e o que vai
          # para a main se o PR entrar, que e o que vale validar.
          #
          # Imutavel na pratica: cada push no PR muda o head, e com ele a tag.
          # Nenhum `pr-<N>` sem o sha, que seria reescrito a cada push e deixaria
          # o kubelet com a copia velha em cache (IfNotPresent).
          {
            echo "tags<<FIM_DAS_TAGS"
            echo "$IMAGEM:$tag"
            if [ -n "$PR_NUMERO" ] && [ -n "$PR_HEAD" ]; then
              echo "$IMAGEM:pr-$PR_NUMERO-${PR_HEAD:0:7}"
            fi
            echo "FIM_DAS_TAGS"
          } >> "$GITHUB_OUTPUT"
          # O SHA completo sai do MESMO HEAD que gerou a tag, e nao de
          # `github.sha`: num pull_request o checkout aponta para o merge
          # commit, e os dois divergiriam — a imagem diria ter vindo de um
          # commit que nao e o que a construiu.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Virgula em `platforms` significa multi-plataforma, e `load: true` nao
          # aceita mais de uma — e o que decide entre varrer antes ou depois de
          # publicar.
          case "$PLATAFORMAS" in
            *,*) echo "uma_plataforma=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "uma_plataforma=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------- caminho A: uma plataforma (o normal) -----
      - name: Construir para o daemon local
        if: steps.meta.outputs.uma_plataforma == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          load: true
          push: false
          tags: ${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          # Passado SEMPRE. Um Dockerfile que nao declara `ARG GIT_SHA` so
          # recebe o aviso "one or more build-args were not consumed" — nao
          # falha. Quem declara ganha de graca poder dizer, em tempo de
          # execucao, de qual commit veio o binario que esta no ar; sem isso um
          # endpoint de versao informa o que foi pedido, e nao o que rodou.
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
          # Secret do BuildKit, e nao `build-arg`. O valor e montado em
          # `/run/secrets/npm_token` durante o RUN que o pede e nao entra em
          # camada nenhuma — nem na imagem, nem no cache `type=gha`, que guarda
          # camadas intermediarias. Dockerfile que nao declara o `--mount`
          # simplesmente ignora; secret nao consumido nao emite nem aviso.
          secrets: |
            npm_token=${{ secrets.GH_PACKAGES_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # ------------------- caminho B: multi-plataforma, publica antes de varrer
      - name: Construir e publicar (multi-plataforma)
        if: steps.meta.outputs.uma_plataforma == 'false'
        id: publicar_multi
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
          # Secret do BuildKit, e nao `build-arg`. O valor e montado em
          # `/run/secrets/npm_token` durante o RUN que o pede e nao entra em
          # camada nenhuma — nem na imagem, nem no cache `type=gha`, que guarda
          # camadas intermediarias. Dockerfile que nao declara o `--mount`
          # simplesmente ignora; secret nao consumido nao emite nem aviso.
          secrets: |
            npm_token=${{ secrets.GH_PACKAGES_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # ------------------------------------------------------------ varredura -
      - name: Varrer a imagem (relatorio, nao derruba)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-imagem.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: ${{ inputs.trivyignores }}
          exit-code: "0"

      - name: Contexto da publicacao de SARIF
        id: sarif
        env:
          MODO: ${{ inputs.publicar_sarif }}
          PRIVADO: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          privado="${PRIVADO:-true}"
          case "$MODO" in
            sempre) publica=true ;;
            nunca)  publica=false ;;
            *)      if [ "$privado" = "false" ]; then publica=true; else publica=false; fi ;;
          esac
          echo "publica=$publica" >> "$GITHUB_OUTPUT"

      - name: Enviar para a aba Security
        if: always() && steps.sarif.outputs.publica == 'true' && hashFiles('trivy-imagem.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-imagem.sarif
          category: trivy-imagem

      - name: Relatorio no painel
        if: always()
        uses: slipalison/github-workflows/.github/actions/relatar-sarif@main
        with:
          sarif: trivy-imagem.sarif
          titulo: "Imagem - vulnerabilidades"
          bloquear: ""
          explicacao: >-
            Relatorio completo (CRITICAL, HIGH e MEDIUM), sem portao. O portao e
            o passo seguinte, e roda separado por um motivo medido: o
            `trivy-action` da precedencia a entrada `severity` sobre a variavel
            `TRIVY_SEVERITY`, entao a versao que tentava fazer as duas coisas num
            passo so dizia no comentario que bloqueava CRITICAL e bloqueava HIGH
            junto.

      - name: Portao de seguranca
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          format: table
          severity: ${{ inputs.severidade_bloqueante }}
          # ignore-unfixed: CVE sem correcao disponivel nao e acionavel. Bloquear
          # por ele so ensina a lista de excecao a crescer — e uma lista de
          # excecao grande e um portao desligado com passos extras.
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: ${{ inputs.trivyignores }}
          exit-code: "1"

      # ---------------------------------------------------- publicar (A) ------
      # So chega aqui se o portao acima passou: a imagem com CRITICAL nunca sai
      # da maquina.
      - name: Publicar
        id: publicar
        if: steps.meta.outputs.uma_plataforma == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # IDENTICO ao passo de construcao, e nao por simetria: um build-arg
          # diferente muda o layer, erra o cache e produz uma imagem OUTRA. O
          # Trivy teria varrido uma e o GHCR receberia a outra — o portao
          # continuaria verde falando de uma imagem que ninguem publicou.
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.sha }}
          # Mesmo cache do passo de construcao: nao ha recompilacao, so o envio
          # dos layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Resumo
        if: always()
        env:
          IMAGEM: ${{ inputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          DIGEST: ${{ steps.publicar.outputs.digest || steps.publicar_multi.outputs.digest }}
        run: |
          {
            echo "## Imagem"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Referencia | \`${IMAGEM}:${TAG}\` |"
            echo "| Digest | \`${DIGEST:-nao publicada}\` |"
            echo "| Portao | ${{ inputs.severidade_bloqueante }} derruba |"
          } >> "$GITHUB_STEP_SUMMARY"
