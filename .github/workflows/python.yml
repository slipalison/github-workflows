name: Python — lint e testes

on:
  workflow_call:
    inputs:
      python_version:
        required: false
        type: string
        default: "3.13"
      requirements:
        description: "Arquivo de dependencias de execucao"
        required: false
        type: string
        default: "requirements.txt"
      requirements_dev:
        description: "Dependencias de teste; vazio = so o de cima"
        required: false
        type: string
        default: "requirements-dev.txt"
      run_tests:
        required: false
        type: boolean
        default: true
      min_coverage:
        description: "Cobertura minima (%). 0 desliga a exigencia"
        required: false
        type: number
        default: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          [ -f "${{ inputs.requirements }}" ] && pip install -r "${{ inputs.requirements }}"
          if [ -n "${{ inputs.requirements_dev }}" ] && [ -f "${{ inputs.requirements_dev }}" ]; then
            pip install -r "${{ inputs.requirements_dev }}"
          fi

      - name: Lint (ruff)
        run: |
          set -euo pipefail
          pip install ruff
          # `check` acusa erro de codigo; `format --check` acusa formatacao.
          # Separados de proposito: a mensagem diz qual dos dois e.
          ruff check .
          ruff format --check .

      - name: Testes
        if: inputs.run_tests
        run: |
          set -euo pipefail
          if [ "${{ inputs.min_coverage }}" != "0" ]; then
            pytest -q --cov --cov-report=term-missing \
                   --cov-fail-under=${{ inputs.min_coverage }}
          else
            pytest -q
          fi
