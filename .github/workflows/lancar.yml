name: Lancar versao

# O ultimo job da esteira, e o unico que cria alguma coisa com o token do
# repositorio: o alias da imagem, a tag, a release. Roda depois de TODOS os
# portoes e depois do GitOps, so na main. A tag e a prova de que aquele commit
# passou por tudo e chegou ao cluster — por isso nasce por ultimo.
#
# SO GITHUB_TOKEN, NENHUM PAT
# ---------------------------
# Tag e release criadas com o GITHUB_TOKEN nao disparam outros workflows
# (`on: push: tags` fica surdo). Nao e problema: tudo o que precisa da versao
# acontece NESTE run. A alternativa — um PAT para "acordar" outro workflow — e
# uma credencial de conta inteira, permanente, guardada em secret. E o que o
# release-please pede, e o que este desenho evita.
#
# IDEMPOTENTE POR CONSTRUCAO
# --------------------------
# A versao e recalculada aqui e comparada com a que o job `versao` calculou no
# inicio do run. Se entrou tag ou commit no meio, os dois numeros divergem e o
# job reprova sem criar nada. Um run cancelado pelo `cancel-in-progress` nao
# deixa tag, e o proximo chega ao mesmo numero sozinho.
#
# QUEM CHAMA CONCEDE `contents: write` E `packages: write` — os dois, sempre
# ---------------------------------------------------------------------------
# Mesmo repositorio sem imagem. O job `alias` fica pulado, mas a checagem de
# permissao do GitHub e ESTATICA: le o arquivo, nao o `if`. Medido, no primeiro
# run do proprio github-workflows (que nao tem imagem):
#   "The nested job 'alias' is requesting 'packages: write', but is only
#    allowed 'packages: none'"  -> startup_failure, sem job nenhum.
#
# PACOTES, SOMAS, CHANGELOG E RASCUNHO — tudo opcional
# ----------------------------------------------------
# `artefatos` e um padrao de nome de artefato DESTE run (`pacotes-*`): os
# arquivos sao baixados ANTES da release, entram nela como anexos junto de um
# `SHA256SUMS`, e o `gh release create` so publica depois de subir todos — uma
# release publicada nunca fica sem pacote. `changelog` e o caminho de um
# CHANGELOG no formato Keep a Changelog: a secao `## [<versao>]`, ou a
# `## [Unreleased]` se ela nao existir, abre as notas. `rascunho: true` cria a
# release como RASCUNHO, que nao cria a tag e nao e publico: e como um
# repositorio ensaia o job inteiro fora da main. Antes de criar, um rascunho
# que ja exista com a MESMA tag e apagado (o que sobra de um ensaio ou de um
# run cancelado); release publicada nunca. Sem os tres, os passos e comandos
# sao os de antes.

on:
  workflow_call:
    inputs:
      versao:
        description: "Versao calculada pelo job versao (1.4.0)"
        required: true
        type: string
      tag:
        description: "A mesma como tag (v1.4.0)"
        required: true
        type: string
      imagem:
        description: "Imagem sem tag, para receber o alias :<versao>. Vazio pula."
        required: false
        type: string
        default: ""
      digest:
        description: "Digest da imagem publicada (sha256:...). O alias aponta para ele."
        required: false
        type: string
        default: ""
      tag_movel_major:
        description: >-
          Tambem aponta a tag vN (v1, v2) para este commit, como fazem as actions
          do GitHub. Para repositorio de templates e actions; sem sentido para
          servico. Nunca junto com `rascunho`: reprova.
        required: false
        type: boolean
        default: false
      commits_sem_tipo:
        required: false
        type: string
        default: "reprovar"
      versao_inicial:
        required: false
        type: string
        default: "1.0.0"
      artefatos:
        description: >-
          Padrao de nome dos artefatos deste run a anexar a release
          (`pacotes-*`). Vazio nao baixa nem anexa nada.
        required: false
        type: string
        default: ""
      rascunho:
        description: >-
          Cria a release como rascunho: sem tag e sem publicar. Para ensaiar o
          job fora da main. Nunca junto com `tag_movel_major`: reprova.
        required: false
        type: boolean
        default: false
      changelog:
        description: >-
          CHANGELOG no formato Keep a Changelog (`CHANGELOG.md`). A secao da
          versao, ou a `[Unreleased]`, abre as notas. Vazio: so as notas dos
          commits.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  alias:
    name: Alias da imagem
    if: inputs.imagem != '' && inputs.digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Endurecer o runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            api.github.com:443

      - name: Conferir imagem e digest
        # O nome da imagem e o digest vao para uma linha de comando. Sao saidas
        # de outro job da mesma esteira, mas um `[[ =~ ]]` custa nada e fecha a
        # porta para sempre.
        env:
          IMAGEM: ${{ inputs.imagem }}
          DIGEST: ${{ inputs.digest }}
          VERSAO: ${{ inputs.versao }}
        run: |
          set -euo pipefail
          [[ "$IMAGEM" =~ ^[a-z0-9][a-z0-9._/-]*$ ]] || { echo "::error::imagem invalida: $IMAGEM"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest invalido: $DIGEST"; exit 1; }
          [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versao invalida: $VERSAO"; exit 1; }

      - name: Login no GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apontar :<versao> para o digest
        # Nao reconstroi nada: publica uma referencia nova no registro para o
        # MESMO manifesto que `sha-<commit>`. A identidade que o cluster usa
        # continua sendo o sha; a versao e um nome legivel para os mesmos bits.
        #
        # O DIGEST DE `:<versao>` NAO E O DIGEST DE ORIGEM, e isso confunde.
        # `imagetools create` nao copia uma tag: ele cria um INDICE OCI novo com
        # um item so, apontando para o manifesto de origem. Entao
        #   :sha-597c032 -> sha256:06aadce4...   (manifesto)
        #   :1.0.0       -> sha256:67ea2b5b...   (indice que contem 06aadce4)
        # Mesmos bits, embrulho diferente. Medido em 2026-09-13, quando a trava
        # nova do verificar-plataforma.sh comparou os dois digests direto e
        # acusou o alias de apontar para outra imagem — o alarme estava errado,
        # nao o alias. Quem for conferir isso de fora precisa olhar DENTRO do
        # indice; quem quiser fixar por digest deve usar o do `sha-<commit>`.
        env:
          IMAGEM: ${{ inputs.imagem }}
          DIGEST: ${{ inputs.digest }}
          VERSAO: ${{ inputs.versao }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGEM:$VERSAO" "$IMAGEM@$DIGEST"
          {
            echo "## Alias da imagem"
            echo ""
            echo "\`$IMAGEM:$VERSAO\` -> \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  lancar:
    name: Tag e release
    needs: [alias]
    # `always()` porque o alias e opcional (repositorio sem imagem): pulado esta
    # liberado, falho nao.
    if: always() && (needs.alias.result == 'success' || needs.alias.result == 'skipped')
    runs-on: ubuntu-latest
    # Medido no ensaio do ddc-control (run 36432836623): 20 s com os sete
    # pacotes (~100 MB) baixados, somados e subidos de novo.
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Preparar
        uses: slipalison/github-workflows/.github/actions/preparar@main
        with:
          historico-completo: "true"
          # Este job segura um token com escrita no repositorio. Como no
          # deploy, a saida de rede e uma lista fechada, e cada destino foi
          # MEDIDO: ensaio do ddc-control em `audit` (run 36432836623), no log
          # do pos-passo do harden-runner (`endpoint called ...`). Os
          # comentarios ficam aqui fora; dentro do bloco `|` virariam destino.
          #   github.com          o checkout do `Preparar`, historico inteiro
          #   api.github.com      o gh: a tag existe?, o rascunho velho, a
          #                       release e o id dela
          #   uploads.github.com  o `gh release create` subindo os anexos
          #   results-receiver.actions.githubusercontent.com
          #                       `Baixar pacotes`: o servico de artefatos
          # O blob dos artefatos (productionresultssa0..19.blob.core.windows.net,
          # medido o sa3) nao entra: o harden-runner o libera sozinho em
          # `block`, porque vem da lista de dominios do Actions em
          # api.github.com/meta, que o agente busca e mostra no mesmo log
          # (`fetched GitHub meta domains`).
          egresso: block
          destinos-liberados: |
            github.com:443
            api.github.com:443
            uploads.github.com:443
            results-receiver.actions.githubusercontent.com:443

      - name: Conferir as entradas
        # Sem arquivo, sem rede e sem outra variavel: so os valores que vao
        # virar argumento de comando ou caminho, e uma combinacao proibida.
        # `artefatos` vira `pattern` de uma action e `changelog`, caminho de
        # arquivo; os dois chegam aqui por `env` e passam por `[[ =~ ]]`, que
        # casa a string inteira (um grep casaria linha a linha e deixaria
        # passar um valor com quebra de linha). O padrao de artefato nao tem
        # `/`, espaco nem metacaractere de shell alem do `*`; o caminho do
        # changelog e relativo e sem `..`.
        #
        # TAG MOVEL NUNCA NUM RASCUNHO. O rascunho e o ensaio fora da main: nao
        # cria nem a tag da versao. Mas `Mover a tag de major` cria ou move a
        # `vN` de verdade, a que os consumidores do repositorio usam, e num
        # ensaio a apontaria para um commit que nunca passou pela main. A
        # combinacao reprova aqui, antes de tudo; o `if` daquele passo e a
        # segunda trava. Os dois booleanos valem `false` sem a variavel, para o
        # script rodar sozinho fora do Actions; no job o `env` sempre os traz.
        env:
          VERSAO: ${{ inputs.versao }}
          TAG: ${{ inputs.tag }}
          ARTEFATOS: ${{ inputs.artefatos }}
          CHANGELOG: ${{ inputs.changelog }}
          MOVEL: ${{ inputs.tag_movel_major }}
          RASCUNHO: ${{ inputs.rascunho }}
        run: |
          set -euo pipefail
          [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versao invalida: $VERSAO"; exit 1; }
          [ "$TAG" = "v$VERSAO" ] || { echo "::error::tag $TAG nao corresponde a versao $VERSAO"; exit 1; }
          if [ -n "$ARTEFATOS" ] && ! [[ "$ARTEFATOS" =~ ^[A-Za-z0-9_.*-]+$ ]]; then
            echo "::error::artefatos: um padrao de nome de artefato, so [A-Za-z0-9_.*-]: $ARTEFATOS"
            exit 1
          fi
          if [ -n "$CHANGELOG" ]; then
            if ! [[ "$CHANGELOG" =~ ^[A-Za-z0-9_./-]+$ ]] || [[ "$CHANGELOG" == *..* ]]; then
              echo "::error::changelog: caminho relativo ao repositorio, so [A-Za-z0-9_./-] e sem '..': $CHANGELOG"
              exit 1
            fi
          fi
          if [ "${MOVEL:-false}" = "true" ] && [ "${RASCUNHO:-false}" = "true" ]; then
            echo "::error::tag_movel_major com rascunho: o ensaio moveria a tag vN de verdade para um commit fora da main."
            exit 1
          fi

      - name: Recalcular e conferir
        # Mesmo script, mesma resposta — ou o run para aqui.
        #
        # `novos: HEAD..HEAD` (faixa vazia) de proposito: quem julga commit e o
        # job `versao`, com a faixa do push. Aqui nada e novo. Sem isto, o
        # recalculo tratava TODOS os commits desde a tag como novos e reprovava
        # os antigos sem tipo que o `versao` ja tinha deixado passar — medido no
        # primeiro run do demo-python: 17 commits, 3 sem tipo, tag nenhuma.
        id: calc
        uses: slipalison/github-workflows/.github/actions/versao@main
        with:
          commits-sem-tipo: ${{ inputs.commits_sem_tipo }}
          versao-inicial: ${{ inputs.versao_inicial }}
          novos: "HEAD..HEAD"
          esperada: ${{ inputs.versao }}

      - name: A tag ainda nao existe?
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::A tag $TAG ja existe. Nada foi criado."
            exit 1
          fi

      - name: Baixar pacotes
        # Todos os artefatos do run que casam com o padrao, soltos numa pasta
        # so (`merge-multiple`). Sem `run-id`: dentro do mesmo run, a action ja
        # acha os artefatos dos jobs anteriores.
        if: inputs.artefatos != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artefatos }}
          merge-multiple: true
          path: pacotes-baixados

      - name: Somas SHA256
        # `SHA256SUMS` no formato do `sha256sum`, feito DE DENTRO da pasta: so
        # o nome de cada arquivo, para `sha256sum -c SHA256SUMS` funcionar
        # na pasta de quem baixa. Padrao que nao casou nada, subdiretorio
        # (artefato com pasta dentro, que o anexo nao representa) ou nome fora
        # de [A-Za-z0-9._+-] reprovam: o anexo leva o nome do arquivo, e um
        # nome com espaco quebraria o `sha256sum -c` de quem baixa.
        if: inputs.artefatos != ''
        working-directory: pacotes-baixados
        run: |
          set -euo pipefail
          if [ -n "$(find . -mindepth 1 -type d)" ]; then
            echo "::error::artefatos: os pacotes baixados tem subdiretorio; esperado so arquivos."
            exit 1
          fi
          mapfile -t arquivos < <(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [ "${#arquivos[@]}" = 0 ]; then
            echo "::error::artefatos: nenhum arquivo nos artefatos do run."
            exit 1
          fi
          for arquivo in "${arquivos[@]}"; do
            if ! [[ "$arquivo" =~ ^[A-Za-z0-9._+-]+$ ]] || [ "$arquivo" = "SHA256SUMS" ]; then
              echo "::error::artefatos: nome de arquivo recusado: $arquivo"
              exit 1
            fi
          done
          sha256sum -- "${arquivos[@]}" > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - name: Montar as notas
        # A secao do CHANGELOG escrita por gente abre as notas; as notas dos
        # commits, que o `versao` gera, vem depois. `## [<versao>]` se ja
        # existir (quem fecha a secao antes do push), senao `## [Unreleased]`.
        # A secao vai ate o proximo `## [`. Tudo por ARQUIVO: texto de
        # terceiro nunca passa por linha de comando.
        id: notas
        if: inputs.changelog != ''
        env:
          CHANGELOG: ${{ inputs.changelog }}
          VERSAO: ${{ inputs.versao }}
          NOTAS: ${{ steps.calc.outputs.notas }}
        run: |
          set -euo pipefail
          if [ ! -f "$CHANGELOG" ]; then
            echo "::error::changelog: $CHANGELOG nao existe no repositorio."
            exit 1
          fi
          secao() {
            awk -v titulo="$1" '
              index($0, titulo) == 1 { dentro = 1; next }
              dentro && /^## \[/ { exit }
              dentro && !texto && /^[[:space:]]*$/ { next }
              dentro { texto = 1; print }
            ' "$CHANGELOG"
          }
          titulo="## [$VERSAO]"
          trecho=$(secao "$titulo")
          if [ -z "${trecho//[[:space:]]/}" ]; then
            titulo="## [Unreleased]"
            trecho=$(secao "$titulo")
          fi
          if [ -z "${trecho//[[:space:]]/}" ]; then
            echo "::error::changelog: $CHANGELOG nao tem secao ## [$VERSAO] nem ## [Unreleased] com conteudo."
            exit 1
          fi
          saida="$RUNNER_TEMP/notas-release.md"
          {
            printf '%s\n\n' "$trecho"
            cat "$NOTAS"
          } > "$saida"
          echo "Notas: $titulo de $CHANGELOG ($(wc -c < "$saida") bytes)."
          echo "arquivo=$saida" >> "$GITHUB_OUTPUT"

      - name: Apagar rascunho velho da mesma tag
        # Um ensaio (`rascunho: true`) ou um run cancelado deixa um RASCUNHO
        # com a tag desta versao. Rascunho nao cria tag, entao a checagem de
        # cima nao o ve, e a release nova nasceria ao lado dele. Apaga so
        # rascunho com a MESMA tag, pelo id; release publicada nunca. A tag
        # passou pela regex em `Conferir as entradas`.
        if: inputs.artefatos != '' || inputs.rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.draft == true and .tag_name == \"$TAG\") | .id")
          apagados=0
          for id in $ids; do
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
            echo "Rascunho $id de $TAG apagado."
            apagados=$((apagados + 1))
          done
          echo "$apagados rascunho(s) de $TAG apagado(s)."

      - name: Criar a tag e a release
        # `gh release create` cria a tag no commit alvo e a release de uma vez,
        # com as notas geradas dos commits. As notas entram por ARQUIVO: assunto
        # de commit e texto de terceiro, e nunca passa por uma linha de comando.
        # Com anexos, o gh cria a release em rascunho, sobe todos e so entao
        # publica: uma release publicada nunca fica sem pacote. Com
        # `rascunho`, ela fica rascunho, e a tag so nasce quando alguem a
        # publicar.
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSAO: ${{ inputs.versao }}
          NOTAS: ${{ steps.notas.outputs.arquivo || steps.calc.outputs.notas }}
          SHA: ${{ github.sha }}
          ARTEFATOS: ${{ inputs.artefatos }}
          RASCUNHO: ${{ inputs.rascunho }}
        run: |
          set -euo pipefail
          args=("$TAG" --target "$SHA" --title "$VERSAO" --notes-file "$NOTAS")
          if [ "$RASCUNHO" = "true" ]; then args+=(--draft); fi
          if [ -n "$ARTEFATOS" ]; then
            mapfile -t anexos < <(find pacotes-baixados -maxdepth 1 -type f | LC_ALL=C sort)
            args+=("${anexos[@]}")
          fi
          gh release create "${args[@]}"
          echo "Release $TAG criada em $SHA."
          if [ -n "$ARTEFATOS" ] || [ "$RASCUNHO" = "true" ]; then
            gh api "repos/$GH_REPO/releases?per_page=100" \
              --jq "first(.[] | select(.tag_name == \"$TAG\")) | \"id=\(.id)\nurl=\(.html_url)\nanexos=\(.assets | length)\"" \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Mover a tag de major
        # Nunca num rascunho, que nao cria nem a tag da versao. O `Conferir as
        # entradas` ja reprova a combinacao; este `if` e a segunda trava.
        if: inputs.tag_movel_major && !inputs.rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSAO: ${{ inputs.versao }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          movel="v${VERSAO%%.*}"
          if gh api "repos/$GH_REPO/git/ref/tags/$movel" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$movel" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$movel" -f sha="$SHA" >/dev/null
          fi
          echo "$movel -> $SHA"

      - name: Resumo
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          MOVEL: ${{ inputs.tag_movel_major }}
          VERSAO: ${{ inputs.versao }}
          RASCUNHO: ${{ inputs.rascunho }}
          ID: ${{ steps.release.outputs.id }}
          URL: ${{ steps.release.outputs.url }}
          ANEXOS: ${{ steps.release.outputs.anexos }}
        run: |
          {
            echo "## Lancamento"
            echo ""
            echo "| | |"
            echo "|---|---|"
            if [ "$RASCUNHO" = "true" ]; then
              echo "| Rascunho | [$TAG]($URL), sem tag |"
            else
              echo "| Release | [$TAG](https://github.com/$REPO/releases/tag/$TAG) |"
            fi
            if [ -n "$ID" ]; then echo "| id | $ID |"; fi
            if [ -n "$ANEXOS" ]; then echo "| Anexos | $ANEXOS |"; fi
            if [ "$MOVEL" = "true" ]; then echo "| Tag movel | v${VERSAO%%.*} |"; fi
          } >> "$GITHUB_STEP_SUMMARY"
