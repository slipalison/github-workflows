name: Pipeline

# A esteira inteira num `uses:` so. O repositorio da aplicacao passa a ter um
# ci.yml de vinte linhas em vez de copiar a orquestracao.
#
# O DESENHO, E A MUDANCA QUE MAIS IMPORTA
# ---------------------------------------
# Antes, aqui e no `demo-python`:
#
#     testes  ->  imagem  ->  publicar
#
# Tres etapas em fila. A imagem esperava os testes por um motivo que nao se
# sustenta: `docker build` nao depende de `pytest`. O que NAO pode acontecer e
# uma imagem de codigo reprovado chegar ao cluster — e quem impede isso e o
# `publicar`, nao o `imagem`. Uma tag `sha-<commit>` no registro de um commit que
# falhou nao machuca ninguem: ninguem a referencia.
#
# Agora:
#
#     versao     ─┐
#     qualidade  ─┤
#     imagem     ─┼──>  publicar  ──>  lancar   (so na main, e so se TUDO passou)
#     sonar      ─┤     (GitOps)       (alias da imagem, tag, release)
#     seguranca  ─┘
#
# O relogio passa a ser o do job mais lento, e nao a soma.
#
# NUMEROS MEDIDOS, e nao estimados (demo-python, 2026-09-13):
#   esteira antiga, 3 jobs em fila (testes 18s -> imagem 43s -> publicar 9s): 78s
#   esteira nova, 13 jobs:                                                    100s
# A nova e 22s mais LENTA de relogio, e faz sete varreduras de seguranca, Sonar
# e piso de cobertura que a antiga nao fazia. Os mesmos jobs em fila somariam
# ~5min. O paralelismo nao encurtou o que ja existia: absorveu o que faltava.
#
# O job `imagem` sozinho subiu de 43s para 79s de proposito — ele agora constroi,
# varre e SO ENTAO publica.
#
# `publicar` usa `needs` com TODOS eles justamente porque ali o `needs` significa
# alguma coisa — diferente do `needs: backend-build` do `simulator-ccb`, que so
# serializa dois builds identicos porque o primeiro nao deixa artefato.
#
# A VERSAO, SEM NINGUEM ESCREVER NUMERO
# -------------------------------------
# `versao` le os commits desde a ultima tag e decide o salto pelo Conventional
# Commits (feat -> minor, `!` -> major, o resto -> patch). Corre em paralelo
# com o resto: so precisa do git. `publicar` leva o numero ao GitOps, e `lancar`
# — o ultimo — aponta `:<versao>` para o MESMO digest que `sha-<commit>`, cria a
# tag e a release. A identidade que o cluster usa continua sendo o sha; a versao
# e o nome legivel do mesmo bit.
#
# Commit fora do padrao REPROVA `versao`, e com ele o portao e a publicacao. E o
# padrao, de proposito: um commit sem tipo virando patch em silencio seria uma
# quebra de contrato publicada como correcao. `commits_sem_tipo` afrouxa.
#
# O QUE NAO SE DESLIGA EM SILENCIO
# --------------------------------
# `qualidade` e `seguranca` rodam sempre. O Sonar roda quando ha
# `sonar_projeto`; sem ele, o repositorio escreve o motivo em `sonar_dispensa`,
# e sem nenhum dos dois o `portao` REPROVA. Antes de 2026-09-28 um
# `sonar_projeto` vazio pulava o Sonar e o portao marcava "desligada", com a
# mesma cara de uma decisao consciente. Um controle que some por esquecimento
# e a falha que o `sonar.yml` ja recusa no token; aqui ela e recusada um nivel
# acima.
#
# APP DESKTOP TAMBEM ENTRA POR AQUI
# ---------------------------------
# Sem `imagem` e sem `app`, os jobs `imagem` e `publicar` saem pulados e o resto
# e a esteira inteira. O que um instalador precisa a mais passa por inputs:
# `timeout_qualidade` (o Tauri sem cache estoura os 20 minutos padrao),
# `artefatos_release` e `changelog` (os pacotes e as notas da release). O
# `ddc-control` chamou `versao`, `qualidade` e `lancar` avulsos ate 2026-09-28
# e publicou a v0.1.0 sem varredura de seguranca, sem Sonar e sem portao —
# nada no painel dizia que faltavam. E o exemplo `ci-rust-desktop.yml`.
#
# Sem ensaio de release por aqui: o rascunho numa branch de ensaio teria de
# passar pelo Sonar, e o SonarQube Cloud Free so analisa a branch principal e
# os pull requests. Medido no ddc-control (run 36498449337): o relatorio da
# branch sobe, e a consulta do Quality Gate volta "Not authorized or project
# not found". Pular o Sonar no ensaio abriria exatamente a porta que este
# arquivo fecha. Os pacotes de todo PR ficam como artefato do run.

on:
  workflow_call:
    inputs:
      # -------------------------------------------------------------- versao --
      versionar:
        description: "Calcula a versao pelos commits, cria tag e release na main"
        required: false
        type: boolean
        default: true
      commits_sem_tipo:
        description: >-
          reprovar (padrao) | patch | ignorar. O que fazer com commit fora do
          Conventional Commits.
        required: false
        type: string
        default: "reprovar"
      versao_inicial:
        description: "Primeira versao, quando o repositorio nao tem tag vX.Y.Z"
        required: false
        type: string
        default: "1.0.0"
      tag_movel_major:
        description: "Tambem move a tag vN (v1, v2). Para repositorio de templates e actions."
        required: false
        type: boolean
        default: false
      artefatos_release:
        description: >-
          Padrao de nome dos artefatos DESTE run anexados a release, como os
          `pacotes-<componente>` do empacotamento Tauri. Vazio: release sem
          anexos. E o `artefatos` do lancar.yml; use o padrao mais estreito que
          case so os componentes que empacotam.
        required: false
        type: string
        default: ""
      changelog:
        description: >-
          CHANGELOG no formato Keep a Changelog, relativo a raiz. A secao da
          versao (ou a `[Unreleased]`) abre as notas da release. Vazio: so as
          notas dos commits.
        required: false
        type: string
        default: ""

      # ----------------------------------------------------------- qualidade --
      componentes:
        description: >-
          JSON array, um objeto por componente que compila/testa sozinho. Um job
          paralelo para cada. Ver o cabecalho de qualidade.yml.
        required: false
        type: string
        default: '[{"nome":"app","linguagem":"python"}]'
      timeout_qualidade:
        description: >-
          Minutos de cada job de qualidade. Os 20 do padrao nao bastam para um
          app Tauri sem cache no Windows (13 min no primeiro run do
          ddc-control).
        required: false
        type: number
        default: 20

      # -------------------------------------------------------------- imagem --
      imagem:
        description: "Nome da imagem sem tag. Vazio pula o build de imagem."
        required: false
        type: string
        default: ""
      contexto_build:
        required: false
        type: string
        default: "."
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      trivyignores:
        required: false
        type: string
        default: ""
      severidade_bloqueante:
        required: false
        type: string
        default: "CRITICAL"

      # --------------------------------------------------------------- sonar --
      sonar_projeto:
        description: >-
          sonar.projectKey. Vazio pula o Sonar, e entao `sonar_dispensa` e
          obrigatorio: sem nenhum dos dois o portao reprova.
        required: false
        type: string
        default: ""
      sonar_dispensa:
        description: >-
          O MOTIVO de o repositorio nao passar pelo Sonar, em uma linha. So com
          `sonar_projeto` vazio; os dois juntos reprovam. Aparece no painel do
          portao e num `::warning::` em todo run.
        required: false
        type: string
        default: ""
      sonar_organizacao:
        required: false
        type: string
        default: "slipalison"
      sonar_host:
        required: false
        type: string
        default: "https://sonarcloud.io"
      sonar_modo:
        required: false
        type: string
        default: "generico"
      sonar_linguagem:
        required: false
        type: string
        default: "nenhuma"
      sonar_versao_linguagem:
        description: >-
          Versao da linguagem no job do Sonar, como o `versao` de um
          componente. Em Rust e o toolchain do `comando_testes`, que compila
          e mede a cobertura.
        required: false
        type: string
        default: ""
      sonar_projeto_dotnet:
        required: false
        type: string
        default: ""
      sonar_comando_testes:
        required: false
        type: string
        default: ""
      sonar_parametros:
        required: false
        type: string
        default: ""
      sonar_pacotes_sistema:
        description: "Pacotes apt do job do Sonar. Ver `pacotes_sistema` no sonar.yml."
        required: false
        type: string
        default: ""
      sonar_exigir_token:
        required: false
        type: boolean
        default: true

      # ----------------------------------------------------------- seguranca --
      linguagens_codeql:
        required: false
        type: string
        default: '[]'
      caminho_iac:
        required: false
        type: string
        default: ""
      publicar_sarif:
        required: false
        type: string
        default: "auto"
      seguranca_na_main:
        description: >-
          false: no push para a branch de producao, as varreduras NAO rodam de
          novo — o pull request ja as rodou sobre a mesma arvore. So e verdade
          com um ruleset que exija o PR ATUALIZADO com a branch antes do merge
          (status check obrigatorio, modo estrito); sem ele, a arvore do merge
          nunca foi varrida. `qualidade` e `sonar` continuam rodando: o
          primeiro semeia na branch de producao o cache que todo PR herda, e o
          segundo e a linha de base do "New Code".
        required: false
        type: boolean
        default: true

      # ------------------------------------------------------------ publicar --
      app:
        description: "Nome do app no GitOps. Vazio desliga o deploy."
        required: false
        type: string
        default: ""
      gitops_repo:
        required: false
        type: string
        default: "slipalison/homelab-gitops"
      branch_de_producao:
        required: false
        type: string
        default: "main"
    outputs:
      versao:
        description: >-
          A versao que este run calculou (1.4.0). Vazia quando `versionar` e
          false, ou quando o job de versao nao rodou.
        value: ${{ jobs.versao.outputs.versao }}
      tag:
        description: "A mesma como tag (v1.4.0)"
        value: ${{ jobs.versao.outputs.tag }}
      salto:
        description: >-
          major | minor | patch | inicial | nenhum. `nenhum` significa que o
          HEAD ja estava tageado — util para quem chama decidir se ha o que
          publicar.
        value: ${{ jobs.versao.outputs.salto }}

    secrets:
      GH_PACKAGES_TOKEN:
        description: >-
          Token de LEITURA do npm do GitHub (`read:packages`), para repositorio
          cujo frontend dependa de pacote privado do proprio dono. Vai a tres
          lugares, porque sao tres os pontos que instalam: o `npm ci` do job de
          qualidade, o `comando_testes` do Sonar, e o `docker build` — neste
          ultimo como SECRET DO BUILDKIT (id `npm_token`), nunca como build-arg.
          Opcional: quem nao consome pacote privado nao passa, e nada muda.
        required: false
      SONAR_TOKEN:
        required: false
      GITOPS_SSH_KEY:
        required: false
      GITOPS_TOKEN:
        required: false

# O minimo para todo mundo. Cada job pede o que precisa a mais — e um job que
# pede a mais so consegue se QUEM CHAMOU tiver concedido: um workflow
# reutilizavel nunca recebe mais permissao que o chamador.
permissions:
  contents: read

jobs:
  versao:
    if: inputs.versionar
    permissions:
      contents: read
    uses: slipalison/github-workflows/.github/workflows/versao.yml@main
    with:
      commits_sem_tipo: ${{ inputs.commits_sem_tipo }}
      versao_inicial: ${{ inputs.versao_inicial }}

  qualidade:
    # Espera o `versao` por um motivo so: o componente com `carimbar_versao`
    # escreve no pacote a versao que ele calculou. Custa o relogio do `versao`,
    # 16 s entre o inicio dele e o da qualidade no ddc-control (run
    # 36453793875); os outros jobs nao esperam, e o Sonar costuma ser o mais
    # lento. `!cancelled()`: com o `versao` reprovado (commit fora do padrao)
    # ou pulado (`versionar: false`), os testes rodam assim mesmo, e o mesmo
    # run mostra os dois problemas. So o componente que carimba reprova sem
    # versao, no primeiro passo, dizendo por que.
    needs: [versao]
    if: ${{ !cancelled() }}
    uses: slipalison/github-workflows/.github/workflows/qualidade.yml@main
    with:
      componentes: ${{ inputs.componentes }}
      timeout: ${{ inputs.timeout_qualidade }}
      versao: ${{ needs.versao.outputs.versao }}
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  imagem:
    if: inputs.imagem != ''
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: slipalison/github-workflows/.github/workflows/build-push.yml@main
    with:
      image: ${{ inputs.imagem }}
      context: ${{ inputs.contexto_build }}
      dockerfile: ${{ inputs.dockerfile }}
      trivyignores: ${{ inputs.trivyignores }}
      severidade_bloqueante: ${{ inputs.severidade_bloqueante }}
      publicar_sarif: ${{ inputs.publicar_sarif }}
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  sonar:
    if: inputs.sonar_projeto != ''
    permissions:
      contents: read
    uses: slipalison/github-workflows/.github/workflows/sonar.yml@main
    with:
      projeto: ${{ inputs.sonar_projeto }}
      organizacao: ${{ inputs.sonar_organizacao }}
      host: ${{ inputs.sonar_host }}
      modo: ${{ inputs.sonar_modo }}
      linguagem: ${{ inputs.sonar_linguagem }}
      versao_linguagem: ${{ inputs.sonar_versao_linguagem }}
      projeto_dotnet: ${{ inputs.sonar_projeto_dotnet }}
      comando_testes: ${{ inputs.sonar_comando_testes }}
      parametros: ${{ inputs.sonar_parametros }}
      pacotes_sistema: ${{ inputs.sonar_pacotes_sistema }}
      exigir_token: ${{ inputs.sonar_exigir_token }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  seguranca:
    # Pulado so num caso: push na branch de producao com `seguranca_na_main`
    # desligado. E o UNICO jeito de este job sair `skipped` — por isso
    # `publicar` e `lancar` podem aceitar `skipped` sem abrir outra porta.
    if: >-
      inputs.seguranca_na_main
      || github.event_name != 'push'
      || github.ref != format('refs/heads/{0}', inputs.branch_de_producao)
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: slipalison/github-workflows/.github/workflows/seguranca.yml@main
    with:
      linguagens_codeql: ${{ inputs.linguagens_codeql }}
      caminho_iac: ${{ inputs.caminho_iac }}
      publicar_sarif: ${{ inputs.publicar_sarif }}

  publicar:
    # Aqui o `needs` vale: e o unico ponto em que uma etapa realmente depende do
    # resultado das outras.
    needs: [versao, qualidade, imagem, sonar, seguranca]
    # `always()` combinado com os testes explicitos e proposital. Sem ele, um job
    # PULADO (sonar desligado, imagem vazia) conta como nao-sucesso e o deploy
    # nunca acontece; com `always()` sozinho, um job FALHO nao impediria nada.
    # Entao: roda sempre, e exige que nenhum dos cinco tenha falhado ou sido
    # cancelado — pulado esta liberado, falho nao. A `seguranca` so sai pulada
    # por `seguranca_na_main` (ver o `if` dela).
    if: >-
      always()
      && inputs.app != ''
      && github.ref == format('refs/heads/{0}', inputs.branch_de_producao)
      && (needs.versao.result == 'success' || needs.versao.result == 'skipped')
      && needs.qualidade.result == 'success'
      && (needs.seguranca.result == 'success' || needs.seguranca.result == 'skipped')
      && needs.imagem.result == 'success'
      && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
    permissions:
      contents: read
    uses: slipalison/github-workflows/.github/workflows/deploy.yml@main
    with:
      app: ${{ inputs.app }}
      tag: ${{ needs.imagem.outputs.tag }}
      versao: ${{ needs.versao.outputs.versao }}
      gitops_repo: ${{ inputs.gitops_repo }}
    secrets:
      GITOPS_SSH_KEY: ${{ secrets.GITOPS_SSH_KEY }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}

  lancar:
    # O ultimo. Depois de todos os portoes E depois do GitOps: a tag e a prova de
    # que o commit passou por tudo e chegou ao cluster. `salto == nenhum` (HEAD
    # ja tageado, run repetido) nao cria nada.
    needs: [versao, qualidade, imagem, sonar, seguranca, publicar]
    if: >-
      always()
      && inputs.versionar
      && github.event_name != 'pull_request'
      && github.ref == format('refs/heads/{0}', inputs.branch_de_producao)
      && needs.versao.result == 'success'
      && needs.versao.outputs.salto != 'nenhum'
      && needs.qualidade.result == 'success'
      && (needs.seguranca.result == 'success' || needs.seguranca.result == 'skipped')
      && (needs.imagem.result == 'success' || needs.imagem.result == 'skipped')
      && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
      && (needs.publicar.result == 'success' || needs.publicar.result == 'skipped')
    # `contents: write` para a tag e a release; `packages: write` para o alias da
    # imagem. Quem chama precisa conceder os dois — mesma regra do `imagem`.
    permissions:
      contents: write
      packages: write
    uses: slipalison/github-workflows/.github/workflows/lancar.yml@main
    with:
      versao: ${{ needs.versao.outputs.versao }}
      tag: ${{ needs.versao.outputs.tag }}
      imagem: ${{ needs.imagem.result == 'success' && inputs.imagem || '' }}
      digest: ${{ needs.imagem.outputs.digest }}
      tag_movel_major: ${{ inputs.tag_movel_major }}
      commits_sem_tipo: ${{ inputs.commits_sem_tipo }}
      versao_inicial: ${{ inputs.versao_inicial }}
      artefatos: ${{ inputs.artefatos_release }}
      changelog: ${{ inputs.changelog }}

  # Um unico check para marcar como obrigatorio na protecao de branch. Sem isto
  # a lista de checks obrigatorios precisa nomear cada job, e um job novo entra
  # sem ser exigido — protecao que se afrouxa sozinha a cada mudanca.
  portao:
    name: Portao
    needs: [versao, qualidade, imagem, sonar, seguranca]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir os resultados
        env:
          RESULTADOS: |
            versao=${{ needs.versao.result }}
            qualidade=${{ needs.qualidade.result }}
            imagem=${{ needs.imagem.result }}
            sonar=${{ needs.sonar.result }}
            seguranca=${{ needs.seguranca.result }}
          # Por `env`: o motivo e texto de quem chama.
          SONAR_PROJETO: ${{ inputs.sonar_projeto }}
          SONAR_DISPENSA: ${{ inputs.sonar_dispensa }}
        run: |
          set -euo pipefail
          falhou=0
          # O Sonar so sai `skipped` sem `sonar_projeto`, e ai precisa de um
          # motivo escrito (ver "O QUE NAO SE DESLIGA EM SILENCIO" no
          # cabecalho). O motivo vira uma linha: numa anotacao, uma quebra de
          # linha abriria outro comando do runner, e `%` se escreve `%25`; na
          # tabela, `|` abriria outra coluna.
          marca_sonar=""
          if [ -n "$SONAR_PROJETO" ] && [ -n "$SONAR_DISPENSA" ]; then
            echo "::error::sonar_projeto e sonar_dispensa juntos: ou o Sonar roda, ou o motivo de nao rodar fica escrito. Os dois nao dizem qual vale."
            marca_sonar="**ligado e dispensado ao mesmo tempo**"
            falhou=1
          elif [ -z "$SONAR_PROJETO" ] && [ -z "$SONAR_DISPENSA" ]; then
            echo "::error::Sonar desligado sem motivo. Passe sonar_projeto (com o secret SONAR_TOKEN), ou sonar_dispensa com o motivo de este repositorio nao ter Sonar."
            marca_sonar="**desligado sem motivo**"
            falhou=1
          elif [ -z "$SONAR_PROJETO" ]; then
            motivo=$(printf '%s' "$SONAR_DISPENSA" | tr '\r\n' '  ')
            echo "::warning::Sonar dispensado: ${motivo//%/%25}"
            marca_sonar="dispensado: ${motivo//|/\\|}"
          fi
          {
            echo "## Portao"
            echo ""
            echo "| Etapa | Resultado |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS='=' read -r etapa resultado; do
            if [ -z "$etapa" ]; then continue; fi
            case "$resultado" in
              success)  marca="ok" ;;
              skipped)  marca="desligada" ;;
              *)        marca="**$resultado**"; falhou=1 ;;
            esac
            if [ "$etapa" = "sonar" ] && [ -n "$marca_sonar" ]; then
              marca="$marca_sonar"
            fi
            echo "| $etapa | $marca |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$RESULTADOS"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$falhou" = "1" ]; then
            echo "::error::Uma ou mais etapas da esteira falharam."
            exit 1
          fi
          echo "Todas as etapas passaram ou estao desligadas." >> "$GITHUB_STEP_SUMMARY"
