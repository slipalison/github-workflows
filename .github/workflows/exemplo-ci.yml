name: Exemplo — CI completo de um app

# Este arquivo nao roda aqui: e o que se copia para .github/workflows/ci.yml no
# repositorio de uma aplicacao. Trocar 'meu-app' nos dois lugares.
#
# ANTES DE FUNCIONAR, tres coisas fora daqui (detalhe no README):
#   1. apps/meu-app/values.yaml tem de existir no repositorio de GitOps — o
#      deploy falha de proposito se nao existir, porque quem define o que um app
#      e nao e o pipeline;
#   2. o secret GITOPS_TOKEN neste repositorio, fine-grained, com Contents:
#      Read and write APENAS no repositorio de GitOps;
#   3. o pacote da imagem acessivel ao cluster — se for privado no GHCR e nao
#      houver imagePullSecret, o pod fica em ImagePullBackOff dizendo que nao
#      encontrou a imagem, o que nao parece um problema de credencial.
on:
  workflow_dispatch:

jobs:
  testes:
    uses: slipalison/github-workflows/.github/workflows/dotnet.yml@main

  imagem:
    needs: testes
    uses: slipalison/github-workflows/.github/workflows/build-push.yml@main
    with:
      image: ghcr.io/slipalison/meu-app

  publicar:
    needs: imagem
    # So a branch principal chega ao cluster. Pull request faz imagem e testes
    # e para por ai.
    if: github.ref == 'refs/heads/main'
    uses: slipalison/github-workflows/.github/workflows/deploy.yml@main
    with:
      app: meu-app
      tag: ${{ needs.imagem.outputs.tag }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
