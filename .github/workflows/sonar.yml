name: Sonar

# SonarQube / SonarQube Cloud, com Quality Gate travando o merge.
#
# O GUARD CONTRA O PULO SILENCIOSO
# --------------------------------
# Este e o melhor pedaco do `TranslateReader`, e esta aqui generalizado.
#
# O problema: `${{ secrets.SONAR_TOKEN }}` vazio nao da erro. Os passos que
# dependem dele sao pulados, o job fica VERDE e o Quality Gate — que e um check
# obrigatorio — passa sem ter analisado uma linha. O controle desaparece sem
# deixar rastro, que e exatamente a familia de falha que este projeto ja pagou
# caro duas vezes (o webhook do OTel com failurePolicy: Ignore, e a
# NetworkPolicy que cortou o Alloy).
#
# A ausencia do token e legitima em dois casos e so nesses dois:
#   - pull request vindo de fork, porque o GitHub nao expoe secret a fork;
#   - run do Dependabot, que usa um cofre de secrets separado.
# Em qualquer outro contexto, token ausente e configuracao quebrada e o job
# FALHA dizendo isso.
#
# PUBLICO E PRIVADO
# -----------------
# SonarQube Cloud e gratuito para projeto publico e pago para privado. Por isso
# `host` e entrada: repositorio privado aponta para uma instancia propria de
# SonarQube sem mudar mais nada aqui. O que NAO se faz e deixar privado sem
# analise nenhuma e fingir que o portao existe — para isso ha
# `exigir_token: false`, que e explicito e aparece no diff.
#
# A INSTANCIA DO HOMELAB ESTA NUMA REDE PRIVADA
# ---------------------------------------------
# Desde 2026-10-20 ela existe (homelab-gitops, platform/sonarqube/), num
# endereco 10.x que so a tailnet do dono alcanca. Um `host` de faixa privada
# faz este job entrar na tailnet como no EFEMERO, com a `tailscale_tag`, e a
# ACL da tailnet deixa essa tag alcancar so a porta do SonarQube. Por que nao
# pelo tunel da Cloudflare, como os paineis: o Bot Fight Mode desafia o IP de
# datacenter do runner antes do Access (o cloudflare-preview.yml ja mediu
# isso), e o scanner nao sabe mandar os cabecalhos do token de servico.
#
# A entrada e o mais TARDE possivel: depois dos testes no modo generico, que e
# onde o codigo do PR roda. No modo dotnet ela vem antes do `begin`, porque o
# `begin` ja baixa as regras do servidor.
#
# Credencial: OAuth client do Tailscale (TS_OAUTH_CLIENT_ID e TS_OAUTH_SECRET),
# e nao federacao de identidade. A federacao pede `id-token: write`, e o GitHub
# confere permissao de workflow chamado de forma ESTATICA: todo repositorio que
# chama o pipeline.yml sem conceder `id-token` deixaria de partir, inclusive os
# publicos, que nem usam a tailnet.

on:
  workflow_call:
    inputs:
      projeto:
        description: "sonar.projectKey, ex.: slipalison_demo-python"
        required: true
        type: string
      organizacao:
        description: "sonar.organization (SonarQube Cloud); vazio em instancia propria"
        required: false
        type: string
        default: ""
      host:
        required: false
        type: string
        default: "https://sonarcloud.io"
      modo:
        description: >-
          dotnet (usa dotnet-sonarscanner em volta do build, unico jeito de o
          Sonar enxergar C#) | generico (scanner CLI, serve para Python, Node,
          Go, e para qualquer repositorio sem compilacao)
        required: false
        type: string
        default: "generico"
      linguagem:
        description: "Linguagem para preparar o runner no modo generico"
        required: false
        type: string
        default: "nenhuma"
      versao_linguagem:
        required: false
        type: string
        default: ""
      projeto_dotnet:
        description: "Solucao ou csproj a compilar no modo dotnet"
        required: false
        type: string
        default: ""
      comando_testes:
        description: >-
          Comando que roda os testes E gera o relatorio de cobertura. Vazio
          analisa sem cobertura — o Sonar aceita, mas a metrica de cobertura do
          New Code fica em 0% e o Quality Gate reprova por isso.
        required: false
        type: string
        default: ""
      parametros:
        description: "Linhas extras de sonar-project (uma `chave=valor` por linha)"
        required: false
        type: string
        default: ""
      exigir_token:
        description: >-
          Falha se o SONAR_TOKEN faltar num contexto que deveria te-lo.
          Desligar e uma decisao consciente, e fica visivel no arquivo de quem
          chamou — diferente de um job verde que nao analisou nada.
        required: false
        type: boolean
        default: true
      tailscale_tag:
        description: >-
          Tag com que o runner entra na tailnet quando `host` e de faixa
          privada. O OAuth client precisa ter exatamente esta tag, e a ACL da
          tailnet e quem decide o que ela alcanca.
        required: false
        type: string
        default: "tag:ci-sonar"
      pacotes_sistema:
        description: >-
          Pacotes apt, separados por espaco, instalados antes dos testes e da
          analise; o `pacotes_sistema` do qualidade.yml, com a mesma regra. Em
          Rust, o `comando_testes` que mede a cobertura compila o workspace: a
          biblioteca de sistema que o build linka (o WebKitGTK de um app
          Tauri) precisa estar aqui tambem, e nao so no job de qualidade. O
          analisador do Sonar em si nao compila (ver o README, Rust).
        required: false
        type: string
        default: ""
    secrets:
      GH_PACKAGES_TOKEN:
        description: >-
          Token de LEITURA do npm do GitHub (`read:packages`), para componente
          node que dependa de pacote privado do proprio dono. So o `npm ci`
          precisa dele: `build` e `test` nao falam com o registro, e o npm
          tolera a variavel ausente no `.npmrc` (medido no npm 11). Opcional.
        required: false
      SONAR_TOKEN:
        required: false
      TS_OAUTH_CLIENT_ID:
        description: >-
          OAuth client do Tailscale (escopo auth_keys, com a `tailscale_tag`).
          So para `host` de faixa privada; sem ele, nesse caso, o job falha.
        required: false
      TS_OAUTH_SECRET:
        required: false

permissions:
  contents: read

jobs:
  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # No nivel do JOB de proposito: quem instala aqui e o `comando_testes` do
      # repositorio, que pode chamar `npm ci` em qualquer ponto da linha.
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      # PRIMEIRO passo, antes de qualquer checkout: se a configuracao esta
      # quebrada, o run tem de morrer aqui e dizer por que, e nao quinze minutos
      # depois numa tela verde.
      - name: Conferir que a analise nao vai ser pulada em silencio
        if: env.SONAR_TOKEN == ''
        env:
          # Ausencia legitima: fork (o GitHub nao da secret a fork) e Dependabot
          # (cofre proprio). Fora disso, o token deveria estar aqui.
          AUSENCIA_LEGITIMA: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          EXIGIR: ${{ inputs.exigir_token }}
        run: |
          set -euo pipefail
          if [ "$AUSENCIA_LEGITIMA" = "true" ]; then
            echo "::warning::SONAR_TOKEN indisponivel (fork ou Dependabot). A analise e o Quality Gate NAO rodaram neste run — e nao ha o que consertar aqui."
            exit 0
          fi
          if [ "$EXIGIR" != "true" ]; then
            echo "::warning::SONAR_TOKEN ausente e exigir_token=false. A analise e o Quality Gate NAO rodaram."
            exit 0
          fi
          echo "::error::SONAR_TOKEN ausente. A analise do Sonar e o Quality Gate NAO rodaram — e sem este passo o job ficaria VERDE sem ter examinado uma linha."
          echo "::error::Crie o secret SONAR_TOKEN no repositorio, ou passe exigir_token: false se a ausencia for intencional."
          exit 1

      # SONAR_HOST_URL e para SonarQube SERVER. Para o SonarQube CLOUD o README
      # da action e explicito: "Not needed for SonarQube Cloud". Passando mesmo
      # assim, o scanner trata a Cloud como um servidor auto-hospedado, tenta
      # provisionar o JRE pelo caminho de servidor e leva 403:
      #
      #   ERROR Failed to query JRE metadata: GET
      #   https://api.sonarcloud.io/analysis/jres?os=linux&arch=x86_64
      #   failed with HTTP 403 Forbidden
      #
      # A mensagem manda conferir o token, e o token estava certo. Foi medido:
      # com o token recem-criado e valido, o job falhou tres vezes seguidas ate
      # esta linha sair.
      - name: Cloud ou Server?
        if: env.SONAR_TOKEN != ''
        id: destino
        env:
          HOST: ${{ inputs.host }}
        run: |
          set -euo pipefail
          case "$HOST" in
            *sonarcloud.io*|*sonarqube.com*) echo "cloud=true"  >> "$GITHUB_OUTPUT" ;;
            *)                               echo "cloud=false" >> "$GITHUB_OUTPUT" ;;
          esac
          # Endereco de faixa privada (RFC 1918 ou o CGNAT da tailnet): so se
          # chega pela tailnet. Nome de host nao entra aqui de proposito — um
          # nome resolve para onde o DNS quiser, e o caminho tem de ser o mesmo
          # que a ACL autoriza.
          re_privado='^https?://(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.)'
          if [[ $HOST =~ $re_privado ]]; then
            echo "tailnet=true"  >> "$GITHUB_OUTPUT"
          else
            echo "tailnet=false" >> "$GITHUB_OUTPUT"
          fi

      # Mesma regra do token, um passo abaixo: `host` privado sem credencial da
      # tailnet nao chegaria ao servidor, e o erro apareceria la no scanner
      # como "connection timed out", que manda olhar a rede e nao o secret.
      - name: Conferir a credencial da tailnet
        if: env.SONAR_TOKEN != '' && steps.destino.outputs.tailnet == 'true'
        env:
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_SEGREDO: ${{ secrets.TS_OAUTH_SECRET }}
          HOST: ${{ inputs.host }}
        run: |
          set -euo pipefail
          if [ -z "$TS_ID" ] || [ -z "$TS_SEGREDO" ]; then
            echo "::error::$HOST so se alcanca pela tailnet, e faltam TS_OAUTH_CLIENT_ID e/ou TS_OAUTH_SECRET. Grave os dois no repositorio (bin/semear_secret.py)."
            exit 1
          fi

      - name: Preparar
        uses: slipalison/github-workflows/.github/actions/preparar@main
        with:
          linguagem: ${{ inputs.modo == 'dotnet' && 'dotnet' || inputs.linguagem }}
          versao: ${{ inputs.versao_linguagem }}
          # fetch-depth: 0 e obrigatorio. O Sonar usa o blame do git para saber
          # que linha e "New Code"; com historico raso ele trata o repositorio
          # inteiro como novo, e o Quality Gate de New Code passa a medir a
          # coisa errada — normalmente reprovando um pull request de uma linha.
          historico-completo: "true"

      - name: Instalar pacotes do sistema
        # Depois do `preparar`, como no qualidade.yml: o apt e trafego de
        # saida, e o harden-runner ja esta olhando. A lista chega por `env` e
        # passa pela regex antes do apt: uma palavra por pacote, sem opcao.
        if: env.SONAR_TOKEN != '' && inputs.pacotes_sistema != ''
        env:
          PACOTES: ${{ inputs.pacotes_sistema }}
        run: |
          set -euo pipefail
          re_pacotes='^[a-z0-9][a-z0-9.+-]*( [a-z0-9][a-z0-9.+-]*)*$'
          if ! [[ $PACOTES =~ $re_pacotes ]]; then
            echo "::error::pacotes_sistema: nomes de pacote apt separados por um espaco ($re_pacotes)."
            exit 1
          fi
          sudo apt-get update -q
          # shellcheck disable=SC2086 # uma palavra por pacote, de proposito
          sudo apt-get install -y -q --no-install-recommends $PACOTES

      - name: Java (o scanner roda na JVM)
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------- dotnet --
      - name: Instalar dotnet-sonarscanner
        if: env.SONAR_TOKEN != '' && inputs.modo == 'dotnet'
        run: dotnet tool install --global dotnet-sonarscanner

      # A tailnet antes do `begin`: ele ja baixa o perfil de regras do servidor.
      # Os mesmos dois passos aparecem de novo no modo generico, mais abaixo,
      # depois dos testes. Ver o cabecalho, "A INSTANCIA DO HOMELAB".
      - name: Entrar na tailnet (dotnet)
        if: env.SONAR_TOKEN != '' && inputs.modo == 'dotnet' && steps.destino.outputs.tailnet == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ inputs.tailscale_tag }}
          # Versao e sha256 fixos: sem eles a action baixa o .sha256 do mesmo
          # servidor do binario, o que confere integridade e nao origem.
          version: "1.94.2"
          sha256sum: c6f99a5d774c7783b56902188d69e9756fc3dddfb08ac6be4cb2585f3fecdc32
          use-cache: "false"

      - name: Esperar o SonarQube responder (dotnet)
        if: env.SONAR_TOKEN != '' && inputs.modo == 'dotnet' && steps.destino.outputs.tailnet == 'true'
        env:
          HOST: ${{ inputs.host }}
          TAG: ${{ inputs.tailscale_tag }}
        run: |
          set -euo pipefail
          # A rota da tailnet leva alguns segundos para valer depois do `up`.
          # 24 x 5 s cobre isso e um SonarQube reiniciando; mais que isso e
          # servidor fora, e o job deve dizer, nao esperar o timeout do scanner.
          for _ in $(seq 1 24); do
            if curl -fsS --max-time 5 "$HOST/api/system/status" | grep -q '"status":"UP"'; then
              echo "SonarQube UP em $HOST"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$HOST nao respondeu UP em 2 minutos pela tailnet. Confira a ACL (tag $TAG), a rota 10.10.0.0/24 do pve e o pod do SonarQube."
          exit 1

      - name: begin
        if: env.SONAR_TOKEN != '' && inputs.modo == 'dotnet'
        # TUDO o que e dinamico entra por `env`, e nada por interpolacao dentro
        # do `run`. A diferenca nao e estilo: a interpolacao acontece no TEXTO do
        # script antes de o bash ver a primeira linha, entao um valor que traga
        # aspas ou substituicao de comando vira CODIGO. E `pull_request.head.ref`
        # e o nome de uma branch — escolhido por quem abre o pull request,
        # inclusive de um fork. Por `env` o valor e dado, nunca comando.
        env:
          PARAMETROS: ${{ inputs.parametros }}
          PROJETO: ${{ inputs.projeto }}
          HOST: ${{ inputs.host }}
          ORGANIZACAO: ${{ inputs.organizacao }}
          PR_NUMERO: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          args=(/k:"$PROJETO"
                /d:sonar.host.url="$HOST"
                /d:sonar.token="$SONAR_TOKEN"
                # qualitygate.wait vai na fase BEGIN, e nao na END. O
                # SonarScanner for .NET recusa a chave no `end` com
                # "This setting is not valid in the end phase in this version of
                # the C# plugin" e sai 1 sem sequer consultar o portao — o que
                # parece reprovacao e nao e.
                /d:sonar.qualitygate.wait=true)
          if [ -n "$ORGANIZACAO" ]; then
            args+=(/o:"$ORGANIZACAO")
          fi
          if [ -n "$PR_NUMERO" ]; then
            args+=(/d:sonar.pullrequest.key="$PR_NUMERO"
                   /d:sonar.pullrequest.branch="$PR_BRANCH"
                   /d:sonar.pullrequest.base="$PR_BASE")
          fi
          while IFS= read -r linha; do
            if [ -n "$linha" ]; then args+=(/d:"$linha"); fi
          done <<< "$PARAMETROS"
          dotnet-sonarscanner begin "${args[@]}"

      - name: Compilar
        if: env.SONAR_TOKEN != '' && inputs.modo == 'dotnet'
        run: dotnet build ${{ inputs.projeto_dotnet }} -c Release

      - name: Testes com cobertura (dotnet)
        if: env.SONAR_TOKEN != '' && inputs.modo == 'dotnet' && inputs.comando_testes != ''
        run: ${{ inputs.comando_testes }}

      - name: end
        if: env.SONAR_TOKEN != '' && inputs.modo == 'dotnet'
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # ------------------------------------------------------------ generico --
      - name: Testes com cobertura (generico)
        if: env.SONAR_TOKEN != '' && inputs.modo == 'generico' && inputs.comando_testes != ''
        run: ${{ inputs.comando_testes }}

      - name: Escrever sonar-project.properties
        if: env.SONAR_TOKEN != '' && inputs.modo == 'generico'
        env:
          PARAMETROS: ${{ inputs.parametros }}
          PROJETO: ${{ inputs.projeto }}
          HOST: ${{ inputs.host }}
          ORGANIZACAO: ${{ inputs.organizacao }}
        run: |
          set -euo pipefail
          # Um arquivo em vez de uma pilha de -D: o scanner le os dois, mas o
          # arquivo aparece inteiro no log e da para reproduzir na mao.
          {
            echo "sonar.projectKey=$PROJETO"
            if [ -n "$ORGANIZACAO" ]; then
              echo "sonar.organization=$ORGANIZACAO"
            fi
            # Na Cloud, quem resolve o endereco e o proprio scanner a partir da
            # organizacao. Escrever a URL aqui reproduz o mesmo erro do env.
            if [ "${{ steps.destino.outputs.cloud }}" != "true" ]; then
              echo "sonar.host.url=$HOST"
            fi
            echo "sonar.qualitygate.wait=true"
            echo "sonar.scm.provider=git"
            printf '%s\n' "$PARAMETROS"
          } > sonar-project.properties
          echo "--- sonar-project.properties ---"
          cat sonar-project.properties

      # A tailnet so agora, depois dos testes: o codigo do PR ja rodou, e o
      # runner fica na tailnet so o tempo da analise.
      - name: Entrar na tailnet (generico)
        if: env.SONAR_TOKEN != '' && inputs.modo == 'generico' && steps.destino.outputs.tailnet == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ inputs.tailscale_tag }}
          version: "1.94.2"
          sha256sum: c6f99a5d774c7783b56902188d69e9756fc3dddfb08ac6be4cb2585f3fecdc32
          use-cache: "false"

      - name: Esperar o SonarQube responder (generico)
        if: env.SONAR_TOKEN != '' && inputs.modo == 'generico' && steps.destino.outputs.tailnet == 'true'
        env:
          HOST: ${{ inputs.host }}
          TAG: ${{ inputs.tailscale_tag }}
        run: |
          set -euo pipefail
          # O mesmo do passo dotnet.
          for _ in $(seq 1 24); do
            if curl -fsS --max-time 5 "$HOST/api/system/status" | grep -q '"status":"UP"'; then
              echo "SonarQube UP em $HOST"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$HOST nao respondeu UP em 2 minutos pela tailnet. Confira a ACL (tag $TAG), a rota 10.10.0.0/24 do pve e o pod do SonarQube."
          exit 1

      - name: Analisar
        if: env.SONAR_TOKEN != '' && inputs.modo == 'generico'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Vazio em Cloud, de proposito: a action so usa a variavel quando ela
          # tem valor, e com valor ela muda o modo de autenticacao.
          SONAR_HOST_URL: ${{ steps.destino.outputs.cloud == 'true' && '' || inputs.host }}

      - name: Registrar o resultado no painel
        if: always() && env.SONAR_TOKEN != ''
        run: |
          {
            echo "## Sonar"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Projeto | \`${{ inputs.projeto }}\` |"
            echo "| Instancia | ${{ inputs.host }} |"
            echo "| Modo | ${{ inputs.modo }} |"
            if [ "${{ steps.destino.outputs.tailnet }}" = "true" ]; then
              echo "| Caminho | tailnet, no efemero \`${{ inputs.tailscale_tag }}\` |"
            fi
            echo ""
            echo "\`sonar.qualitygate.wait=true\`: o scanner espera o veredito do"
            echo "Quality Gate e derruba este job se ele reprovar. Sem essa flag a"
            echo "reprovacao so apareceria na interface do Sonar, depois do merge."
          } >> "$GITHUB_STEP_SUMMARY"
