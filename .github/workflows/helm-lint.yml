name: Helm — lint e template

on:
  workflow_call:
    inputs:
      chart:
        required: false
        type: string
        default: "oci://ghcr.io/slipalison/charts/app"
      chart_version:
        required: false
        type: string
        # Tem de acompanhar o targetRevision do ApplicationSet no homelab-gitops.
        # Validar contra outra versao e pior que nao validar: passa no CI e
        # renderiza diferente no cluster.
        default: "0.2.0"
      values:
        description: "Caminho do values a validar"
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: Helm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Preparar
        uses: slipalison/github-workflows/.github/actions/preparar@main
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Renderizar com os valores reais
        # `helm lint` nao renderiza o template. Um erro que so aparece com os
        # valores de verdade passa pelo lint sem uma palavra.
        run: |
          helm template validacao ${{ inputs.chart }} \
            --version ${{ inputs.chart_version }} \
            -f ${{ inputs.values }} > /tmp/render.yaml
          wc -l /tmp/render.yaml

      - name: Conferir que nada usa :latest
        run: |
          if grep -nE 'image: .*:latest' /tmp/render.yaml; then
            echo "::error::Ha imagem com :latest no render. O Kyverno recusaria no cluster."
            exit 1
          fi
