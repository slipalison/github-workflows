name: Deploy por commit no GitOps

# Nao aplica nada no cluster. Escreve a tag nova no repositorio de GitOps e o
# ArgoCD faz o resto — que e o ponto de usar GitOps: o estado do cluster e
# sempre um commit que alguem pode ler, culpar e reverter.
on:
  workflow_call:
    inputs:
      app:
        description: "Nome do app (= diretorio em apps/ do gitops)"
        required: true
        type: string
      tag:
        description: "Tag da imagem a publicar"
        required: true
        type: string
      gitops_repo:
        required: false
        type: string
        default: "slipalison/homelab-gitops"
      via_pr:
        description: "Abrir pull request em vez de commitar direto"
        required: false
        type: boolean
        default: false
    secrets:
      GITOPS_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repo }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Escrever a tag
        working-directory: gitops
        run: |
          set -euo pipefail
          arquivo="apps/${{ inputs.app }}/values.yaml"
          if [ ! -f "$arquivo" ]; then
            echo "::error::$arquivo nao existe no GitOps. Crie o app la primeiro."
            exit 1
          fi
          # yq em vez de sed: values.yaml e YAML, e sed em YAML funciona ate o
          # dia em que a indentacao muda.
          yq -i '.image.tag = "${{ inputs.tag }}"' "$arquivo"
          git diff --quiet && { echo "Tag ja era ${{ inputs.tag }}; nada a fazer."; exit 0; }

      - name: Commitar
        if: inputs.via_pr == false
        working-directory: gitops
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/${{ inputs.app }}/values.yaml"
          git commit -m "deploy(${{ inputs.app }}): ${{ inputs.tag }}"
          git push

      - name: Abrir pull request
        if: inputs.via_pr == true
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          ramo="deploy/${{ inputs.app }}-${{ inputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$ramo"
          git add "apps/${{ inputs.app }}/values.yaml"
          git commit -m "deploy(${{ inputs.app }}): ${{ inputs.tag }}"
          git push -u origin "$ramo"
          gh pr create --fill --base main --head "$ramo"
