name: Deploy por commit no GitOps

# Nao aplica nada no cluster. Escreve a tag nova no repositorio de GitOps e o
# ArgoCD faz o resto — que e o ponto de usar GitOps: o estado do cluster e
# sempre um commit que alguem pode ler, culpar e reverter.
#
# DUAS FORMAS DE AUTENTICAR, e a primeira e a preferida:
#
#   GITOPS_SSH_KEY   chave de deploy com escrita, criada NO repositorio de
#                    GitOps. Alcanca aquele repositorio e mais nada, nao
#                    depende de conta nenhuma e se revoga num clique.
#
#   GITOPS_TOKEN     token fine-grained com Contents: Read and write. Continua
#                    funcionando, mas vive preso a uma conta de usuario: se ela
#                    sair ou o token expirar, todo app que o usa para de
#                    publicar ao mesmo tempo.
#
# TAG E VERSAO SAO DUAS COISAS
# ----------------------------
# `image.tag` continua sendo `sha-<commit>`: imutavel, unica por commit, e o que
# o ArgoCD compara. `versao` (1.4.0) e o nome legivel do mesmo bit — vai para o
# chart, que a poe em APP_VERSION, em service.version e no rotulo
# app.kubernetes.io/version. Se a versao fosse a tag deployada, dois commits com
# a mesma versao (um `docs:` sem salto, por exemplo) seriam invisiveis para o
# ArgoCD: mesma tag, nenhum diff, nenhum rollout.
on:
  workflow_call:
    inputs:
      app:
        description: "Nome do app (= diretorio em apps/ do gitops)"
        required: true
        type: string
      tag:
        description: "Tag da imagem a publicar"
        required: true
        type: string
      versao:
        description: "Versao semantica calculada pela esteira (1.4.0). Vazio nao escreve."
        required: false
        type: string
        default: ""
      gitops_repo:
        required: false
        type: string
        default: "slipalison/homelab-gitops"
      via_pr:
        description: "Abrir pull request em vez de commitar direto"
        required: false
        type: boolean
        default: false
    secrets:
      GITOPS_SSH_KEY:
        description: "Chave de deploy com escrita no repositorio de GitOps (preferida)"
        required: false
      GITOPS_TOKEN:
        description: "Token fine-grained com Contents: RW no repositorio de GitOps"
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar no GitOps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Este job manipula uma credencial com escrita em OUTRO repositorio. E o
      # ponto mais sensivel da esteira inteira, e por isso e o unico que trava a
      # saida de rede: `block` com lista, em vez de `audit`. Um passo que tente
      # falar com qualquer outro destino morre aqui, em vez de exfiltrar a chave.
      #
      # A PORTA 22 ESTA NA LISTA POR TER FALTADO. A primeira versao so liberava
      # 443 e o deploy morreu em
      #   ssh: connect to host github.com port 22: Connection refused
      # porque a credencial preferida e uma CHAVE DE DEPLOY, e chave de deploy
      # fala git por SSH. O bloqueio funcionou — bloqueou o trabalho legitimo.
      # E a razao de `audit` ser o padrao na action `preparar`: `block` com lista
      # incompleta nao protege, so quebra, e a lista certa sai do relatorio de um
      # run em `audit`.
      - name: Endurecer o runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            github.com:22
            api.github.com:443
            objects.githubusercontent.com:443

      # O contexto `secrets` NAO existe em `if:` de passo — a mensagem e
      # "Unrecognized named-value: 'secrets'", e ela derruba o run inteiro em
      # startup_failure. O caminho e ler o segredo num passo (onde `env` o
      # aceita) e decidir pelo output dele.
      - name: Escolher a credencial
        id: cred
        env:
          CHAVE: ${{ secrets.GITOPS_SSH_KEY }}
          TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CHAVE:-}" ]; then
            echo "tipo=chave" >> "$GITHUB_OUTPUT"
            echo "Credencial: chave de deploy (alcanca so o repositorio de GitOps)."
          elif [ -n "${TOKEN:-}" ]; then
            echo "tipo=token" >> "$GITHUB_OUTPUT"
            echo "Credencial: token fine-grained."
          else
            echo "::error::Nem GITOPS_SSH_KEY nem GITOPS_TOKEN foram passados."
            echo "::error::Sem credencial nao ha onde escrever a tag."
            exit 1
          fi

      - name: Checkout do GitOps (chave de deploy)
        if: steps.cred.outputs.tipo == 'chave'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.gitops_repo }}
          ssh-key: ${{ secrets.GITOPS_SSH_KEY }}
          path: gitops

      - name: Checkout do GitOps (token)
        if: steps.cred.outputs.tipo == 'token'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.gitops_repo }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Escrever a tag e a versao
        id: escrita
        working-directory: gitops
        # Os valores entram por `env` e chegam ao yq por `strenv`: nada e
        # interpolado dentro do script nem dentro da expressao do yq.
        env:
          APP: ${{ inputs.app }}
          TAG: ${{ inputs.tag }}
          VERSAO: ${{ inputs.versao }}
        run: |
          set -euo pipefail
          [[ "$APP" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::nome de app invalido: $APP"; exit 1; }
          [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]*$ ]] || { echo "::error::tag invalida: $TAG"; exit 1; }
          if [ -n "$VERSAO" ]; then
            [[ "$VERSAO" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versao invalida: $VERSAO"; exit 1; }
          fi
          arquivo="apps/$APP/values.yaml"
          if [ ! -f "$arquivo" ]; then
            echo "::error::$arquivo nao existe no GitOps. Crie o app la primeiro."
            exit 1
          fi
          # yq em vez de sed: values.yaml e YAML, e sed em YAML funciona ate o
          # dia em que a indentacao muda.
          yq -i '.image.tag = strenv(TAG)' "$arquivo"
          if [ -n "$VERSAO" ]; then
            yq -i '.versao = strenv(VERSAO)' "$arquivo"
          fi
          if git diff --quiet; then
            echo "Tag ja era $TAG; nada a fazer."
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$VERSAO" ]; then
            echo "mensagem=deploy($APP): $VERSAO ($TAG)" >> "$GITHUB_OUTPUT"
          else
            echo "mensagem=deploy($APP): $TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Commitar
        if: steps.escrita.outputs.mudou == 'sim' && inputs.via_pr == false
        working-directory: gitops
        env:
          APP: ${{ inputs.app }}
          MENSAGEM: ${{ steps.escrita.outputs.mensagem }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/$APP/values.yaml"
          git commit -m "$MENSAGEM"
          git push

      - name: Abrir pull request
        if: steps.escrita.outputs.mudou == 'sim' && inputs.via_pr == true
        working-directory: gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          APP: ${{ inputs.app }}
          TAG: ${{ inputs.tag }}
          MENSAGEM: ${{ steps.escrita.outputs.mensagem }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::via_pr exige GITOPS_TOKEN — a API de pull request nao aceita chave de deploy."
            exit 1
          fi
          ramo="deploy/$APP-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$ramo"
          git add "apps/$APP/values.yaml"
          git commit -m "$MENSAGEM"
          git push -u origin "$ramo"
          gh pr create --fill --base main --head "$ramo"
