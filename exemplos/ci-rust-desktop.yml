# App desktop em Rust (Tauri 2), testado em Linux E Windows, com a UI do
# webview testada em Node. Copiar para .github/workflows/ci.yml no
# repositorio da aplicacao e trocar os nomes. E a forma do `ddc-control`.
#
# SEM IMAGEM, SEM DEPLOY
# ----------------------
# Um app desktop nao vira container nem vai para o GitOps: `pipeline.yml`
# traria build de imagem, Trivy e deploy para nada. Aqui o caller chama direto
# os tres workflows que servem: `versao` (so calcula, nao cria tag),
# `qualidade` (que tambem empacota msi, NSIS, deb, rpm e AppImage) e, so na
# main, `lancar`, que cria a tag e a release com os pacotes.
#
# O QUE CADA COMPONENTE PROVA
# ---------------------------
#   app-linux    fmt, `cargo audit`, clippy, testes com piso de cobertura, o
#                binario de release e os pacotes deb, rpm e AppImage, mais o
#                `.tar.gz` do CLI. `pacotes_sistema` traz o que o webview do
#                Tauri linka no Linux (WebKitGTK), o libudev de quem fala com
#                hardware e o librsvg que o plugin gtk do AppImage procura pelo
#                pkg-config; nada disso vem na imagem do runner. A auditoria le
#                as excecoes do `.cargo/audit.toml` do repositorio, cada uma
#                com o motivo escrito ao lado.
#                `so: ubuntu-22.04`, e nao o latest: o pacote liga na glibc de
#                onde foi construido, e o do 24.04 (glibc 2.39) nao roda no
#                Ubuntu 22.04 nem no Debian 12.
#   app-windows  os mesmos passos no windows-latest, menos a auditoria (o
#                Cargo.lock e o mesmo: auditar de novo nao prova nada novo),
#                com o msi, o instalador NSIS e o `.zip` do CLI.
#                Cobertura 0: o painel relata, e o piso e medido no Linux, onde
#                o numero nao depende de codigo `cfg(windows)`.
#   ui           `npm ci --ignore-scripts` e `npm test` no diretorio do front,
#                no ubuntu-latest: o `qualidade` so aceita windows-* com
#                `linguagem: rust`, a unica medida no Windows.
#
# A RELEASE, SO NA MAIN. Depois da `qualidade` inteira verde, o `lancar` cria
# a tag e a release com os pacotes dos dois SOs anexados, o `SHA256SUMS` e a
# secao do CHANGELOG. Em pull request ele nunca roda. Num push em
# `ensaio-release/**` ele roda com `rascunho: true`: cria um RASCUNHO, sem tag
# e nao publico, e e como se prova o job inteiro antes do merge. O primeiro
# push de verdade na main apaga esse rascunho e publica a release. Quem pode
# empurrar uma branch dessas ja pode empurrar na main. Nao ensaie perto do
# merge: um ensaio da mesma versao rodando junto com o `lancar` da main
# apagaria o rascunho em transito dela, e a release da main falharia sem
# publicar (ver o cabecalho do lancar.yml).
#
# A VERSAO E CARIMBADA. O Cargo.toml do repositorio diz `0.0.0`, e o
# `qualidade` escreve nele a versao que o `versao` calculou (por isso o
# `needs`), antes do build de release: os pacotes do PR ja saem com o numero
# que o push na main vai ter.
name: CI

on:
  push:
    branches: [main, 'ensaio-release/**']
  pull_request:
  workflow_dispatch:

# Cancela o run anterior da MESMA branch quando chega commit novo. O job do
# Windows leva dezenas de minutos sem cache: tres pushes seguidos seriam tres
# filas dele.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versao:
    permissions:
      contents: read
    uses: slipalison/github-workflows/.github/workflows/versao.yml@main
    with:
      versao_inicial: "0.1.0"

  qualidade:
    needs: [versao]
    permissions:
      contents: read
    uses: slipalison/github-workflows/.github/workflows/qualidade.yml@main
    with:
      # O Tauri compila tres vezes no Windows (clippy, llvm-cov e release), e
      # o primeiro run nao tem cache: os 20 minutos padrao nao bastam.
      timeout: 60
      # A versao do PRODUTO, para o carimbo. O `versao` de cada componente e
      # outra coisa: fixa o toolchain, para o clippy do CI ser o mesmo da
      # maquina de quem commitou.
      versao: ${{ needs.versao.outputs.versao }}
      # `build_release` nomeia o pacote do binario do app no workspace, e o
      # Tauri empacota esse mesmo pacote; `caminho_tauri` e onde mora o
      # tauri.conf.json. `binarios_extra` e o CLI que vai solto na release.
      componentes: |
        [
          {"nome":"app-linux","linguagem":"rust","versao":"1.98","cobertura":80,
           "so":"ubuntu-22.04",
           "pacotes_sistema":"libwebkit2gtk-4.1-dev libudev-dev librsvg2-dev",
           "auditoria":true,"build_release":"meu-app",
           "empacotar_tauri":true,"caminho_tauri":"apps/meu-app/src-tauri",
           "binarios_extra":"meu-cli","carimbar_versao":true},
          {"nome":"app-windows","linguagem":"rust","versao":"1.98","so":"windows-latest",
           "cobertura":0,"build_release":"meu-app",
           "empacotar_tauri":true,"caminho_tauri":"apps/meu-app/src-tauri",
           "binarios_extra":"meu-cli","carimbar_versao":true},
          {"nome":"ui","linguagem":"node","versao":"24","caminho":"ui"}
        ]

  lancar:
    needs: [versao, qualidade]
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ensaio-release/'))
      && needs.versao.outputs.salto != 'nenhum'
    # `packages: write` mesmo sem imagem: a checagem de permissao do GitHub e
    # estatica e le o job `alias` do lancar.yml, que fica pulado. O motivo
    # medido esta no cabecalho do lancar.yml.
    permissions:
      contents: write
      packages: write
    uses: slipalison/github-workflows/.github/workflows/lancar.yml@main
    with:
      versao: ${{ needs.versao.outputs.versao }}
      tag: ${{ needs.versao.outputs.tag }}
      # O MESMO literal do job `versao`: se mudar, muda nos dois.
      versao_inicial: "0.1.0"
      # So os componentes que empacotam (`pacotes-app-linux` e
      # `pacotes-app-windows`). `pacotes-*` casaria tambem o artefato que
      # qualquer outro job do run subisse com esse prefixo, inclusive um job
      # que roda codigo de terceiro, como o `ui` com as dependencias npm.
      artefatos: "pacotes-app-*"
      changelog: CHANGELOG.md
      rascunho: ${{ github.ref != 'refs/heads/main' }}
