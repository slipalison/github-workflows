# Repositorio PRIVADO. Duas coisas mudam, e as duas por causa de licenca:
#
#   1. Enviar SARIF para a aba Security exige GitHub Advanced Security, que em
#      repositorio privado e pago. `publicar_sarif: auto` detecta isso sozinho e
#      NAO tenta enviar — o que evitaria um 403 — sem desligar controle nenhum:
#      o resultado continua no painel de cada job e os portoes continuam
#      derrubando o run. Perde-se a aba, nao a verificacao.
#
#   2. SonarQube Cloud e gratuito so para projeto publico (o Free aceita 50 mil
#      linhas privadas e so analisa a main). `sonar_host` aponta para a
#      instancia do homelab, num endereco que so a tailnet alcanca: o job do
#      Sonar entra nela como no efemero, com TS_OAUTH_CLIENT_ID e
#      TS_OAUTH_SECRET, e la a analise vale para branch e PR, nao so a main.
#      Sem instancia nenhuma, o honesto e `sonar_dispensa` com o motivo — que
#      deixa o pulo VISIVEL no arquivo, em vez de um job verde que nao analisou
#      nada.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esteira:
    permissions:
      # `contents: write` para a tag e a release da versao; `packages: write`
      # para a imagem e o alias :<versao>.
      contents: write
      packages: write
      security-events: write
      actions: read
    uses: slipalison/github-workflows/.github/workflows/pipeline.yml@main
    with:
      componentes: '[{"nome":"app","linguagem":"node","versao":"22"}]'
      publicar_sarif: auto
      # CodeQL sem GHAS tambem nao publica em repositorio privado; deixar a lista
      # vazia evita um job que roda por vinte minutos para descartar o resultado.
      linguagens_codeql: '[]'
      # Na instancia propria a chave do projeto e livre: sem o prefixo
      # `slipalison_` que o SonarCloud exige pela organizacao.
      sonar_projeto: investment-portfolio-balancer
      sonar_host: http://10.10.0.13:30900
      sonar_linguagem: node
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
